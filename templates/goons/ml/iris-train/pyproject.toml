[project]
name = "iris-train"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["scikit-learn>=1.6,<2"]

[project.scripts]
iris-train = "iris_train.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"
