runtime: python
uv: {lock_mode: frozen}
inputs:
  dataset:
    type: choice
    choices: [builtin, captured]
    default: builtin
    description: Builtin Iris data or the fixed captured package resource
  random_seed:
    type: integer
    min: 0
    max: 2147483647
    default: 42
    description: Seed for the project training command's reproducible split
  test_size_percent:
    type: integer
    min: 10
    max: 40
    default: 20
    description: Percentage of examples reserved for evaluation
  minimum_accuracy_percent:
    type: integer
    min: 80
    max: 100
    default: 90
    description: Minimum evaluation accuracy accepted by the training command
  max_iterations:
    type: integer
    min: 100
    max: 2000
    default: 300
    description: Maximum estimator iterations passed to the training command
  training_rounds:
    type: integer
    min: 1
    max: 10000
    default: 1
    description: Finite repeated native fits for workload progress and interruption
steps:
- run: iris-train --dataset ${{ inputs.dataset }} --random-seed ${{ inputs.random_seed }} --test-size-percent ${{ inputs.test_size_percent }} --minimum-accuracy-percent
    ${{ inputs.minimum_accuracy_percent }} --max-iterations ${{ inputs.max_iterations }} --training-rounds ${{ inputs.training_rounds }}
  artifacts:
  - path: ml-output/iris-training-metrics.json
    retention: content_store
  - path: ml-output/iris-model-parameters.json
    retention: content_store
