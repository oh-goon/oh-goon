version: 1
inputs:
  repo: {type: repository_reference}
  skill: {type: skill_reference}
  goal: {default: Follow the selected Skill.}
  acceptance: {type: acceptance_profile, default: agentic-review}
steps:
- uses: agent
  harness: native
  role: review
  task: ${{ inputs.goal }}
  requested_effects:
    repository_access: read_only
    recipients: [configured_model]
