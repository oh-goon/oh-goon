version: 1
inputs:
  kubernetes_api_hostname:
    type: hostname
    description: Hostname of the selected Kubernetes API endpoint
  namespace:
    type: kubernetes_name
    description: Namespace containing the selected workload
  deployment:
    type: kubernetes_deployment_name
    description: Exact Kubernetes Deployment name
  container:
    type: kubernetes_name
    description: Named Deployment container to update or verify
  expected_generation:
    type: string
    description: Exact Deployment generation returned by the preceding update
  expected_image:
    type: string
    description: Exact image reference returned by the preceding update
env:
  KUBERNETES_TOKEN:
    from: host
  KUBERNETES_CA_CERTIFICATE:
    from: host
steps:
- uses: kubernetes_rollout_verify
  id: verify
  target:
    api:
      hostname: ${{ inputs.kubernetes_api_hostname }}
    namespace: ${{ inputs.namespace }}
    name: ${{ inputs.deployment }}
    container: ${{ inputs.container }}
  expected_generation: ${{ inputs.expected_generation }}
  expected_image: ${{ inputs.expected_image }}
  credentials:
    token_env: KUBERNETES_TOKEN
    ca_certificate_env: KUBERNETES_CA_CERTIFICATE
