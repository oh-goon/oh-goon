[project]
name = "airflow-oh-goon-orders"
version = "0.1.0"
description = "Engine independent orders workload from the official Airflow TaskFlow tutorial"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
orders-pipeline = "orders_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
ci = [{include-group = "dev"}, "ruff>=0.12"]
airflow = ["apache-airflow==3.3.2"]

[tool.uv.dependency-groups]
airflow = {requires-python = ">=3.12,<3.15"}

[tool.uv.build-backend]
module-name = "orders_pipeline"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["uv_build>=0.10.0"]
build-backend = "uv_build"
