version: 1
inputs:
  project:
    type: string
    non_empty: true
    default: .
    description: Repository-relative directory containing pyproject.toml and uv.lock
  dependency_group:
    type: string
    non_empty: true
    default: dev
    description: Locked uv dependency group containing the selected tools
uv:
  project: ${{ inputs.project }}
  group: ${{ inputs.dependency_group }}
steps:
- run: uv run pytest --junitxml=junit.xml
  artifacts:
  - path: junit.xml
    retention: evidence
