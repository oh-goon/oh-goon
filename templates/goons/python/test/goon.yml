version: 1
uv:
  group: dev
inputs:
  coverage_threshold:
    type: integer
    min: 70
    max: 100
    default: 70
steps:
- run: uv run pytest -v --cov=src --cov-report=term --cov-report=xml:coverage.xml --junitxml=junit.xml --cov-fail-under=${{ inputs.coverage_threshold }}
  artifacts:
  - path: coverage.xml
    retention: evidence
  - path: junit.xml
    retention: evidence
