inputs:
  project:
    non_empty: true
    default: .
    description: Repository-relative directory containing pyproject.toml and uv.lock
  dependency_group:
    non_empty: true
    default: dev
    description: Locked uv dependency group containing the selected tools
uv:
  project: ${{ inputs.project }}
  group: ${{ inputs.dependency_group }}
steps:
- run: uv run pyinstrument -r html -o pytest-profile.html -m pytest
  artifacts:
  - path: pytest-profile.html
    retention: evidence
