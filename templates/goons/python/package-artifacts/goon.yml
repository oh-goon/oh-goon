inputs:
  project:
    non_empty: true
    default: .
    description: Repository-relative directory containing pyproject.toml and uv.lock
  dependency_group:
    non_empty: true
    default: dev
    description: Locked uv dependency group containing the selected tools
uv:
  project: ${{ inputs.project }}
  group: ${{ inputs.dependency_group }}
steps:
- run: uv run package-artifacts --output-dir dist --bundle package-distributions.tar --manifest package-artifacts.json
  artifacts:
  - path: package-distributions.tar
    retention: content_store
  - path: package-artifacts.json
    retention: evidence
