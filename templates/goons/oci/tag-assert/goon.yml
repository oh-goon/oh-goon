inputs:
  registry_hostname:
    type: hostname
    description: Registry hostname to inspect
  repository:
    type: oci_repository
    description: Exact repository inside the registry
  tag:
    pattern: '[a-z0-9_][a-z0-9_.-]{0,127}'
    description: Explicit tag or project release label to inspect or prepare
  expected_digest:
    type: digest
    description: Exact digest required for the selected registry tag
env:
  OCI_REGISTRY_USERNAME:
    from: host
  OCI_REGISTRY_PASSWORD:
    from: host
outputs:
  OCI_TAG_DIGEST: ${{ steps.assert.outputs.OCI_TAG_DIGEST }}
  OCI_TAG_RESOLVED_REFERENCE: ${{ steps.assert.outputs.OCI_TAG_RESOLVED_REFERENCE }}
steps:
- uses: oci_tag_assert
  id: assert
  target:
    registry:
      hostname: ${{ inputs.registry_hostname }}
    repository: ${{ inputs.repository }}
    tag: ${{ inputs.tag }}
  expected_digest: ${{ inputs.expected_digest }}
  credentials:
    username_env: OCI_REGISTRY_USERNAME
    password_env: OCI_REGISTRY_PASSWORD
