version: 1
inputs:
- base_registry_hostname
- publish_registry_hostname
- publish_repository
- containerfile
- context
- platform
outputs:
  OCI_DIGEST: ${{ goons.oci-publish.outputs.OCI_DIGEST }}
  OCI_REFERENCE: ${{ goons.oci-publish.outputs.OCI_REFERENCE }}
goons:
- import: oci/image
  pass: [base_registry_hostname, containerfile, context, platform]
- import: oci/publish
  pass: [publish_registry_hostname, publish_repository]
  with:
    source_workspace: ${{ goons.oci-image.workspace }}
