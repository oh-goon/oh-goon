version: 1
inputs: [project, dependency_group, typechecker]
goons:
- import: python/ruff
  with:
    project: ${{ inputs.project }}
    dependency_group: ${{ inputs.dependency_group }}
- import: python/typecheck
  with:
    project: ${{ inputs.project }}
    dependency_group: ${{ inputs.dependency_group }}
    typechecker: ${{ inputs.typechecker }}
- import: python/test
  with:
    project: ${{ inputs.project }}
    dependency_group: ${{ inputs.dependency_group }}
