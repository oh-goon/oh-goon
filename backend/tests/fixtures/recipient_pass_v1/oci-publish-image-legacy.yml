version: 1
inputs:
- base_registry_hostname
- publish_registry_hostname
- publish_repository
- containerfile
- context
- platform
outputs:
  OCI_DIGEST: ${{ goons.oci-publish.outputs.OCI_DIGEST }}
  OCI_REFERENCE: ${{ goons.oci-publish.outputs.OCI_REFERENCE }}
goons:
- import: oci/image
  with:
    base_registry_hostname: ${{ inputs.base_registry_hostname }}
    containerfile: ${{ inputs.containerfile }}
    context: ${{ inputs.context }}
    platform: ${{ inputs.platform }}
- import: oci/publish
  with:
    source_workspace: ${{ goons.oci-image.workspace }}
    publish_registry_hostname: ${{ inputs.publish_registry_hostname }}
    publish_repository: ${{ inputs.publish_repository }}
