[project]
name = "oh-goon"
version = "1267.0.1052"
description = "Local-first repository fleet maintenance and strict CI/CD execution"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "cryptography>=46.0.4",
  "fastapi>=0.128.2",
  "httpx2>=2.12",
  "hashmarks @ https://github.com/Hugloss/Hashmarks/releases/download/v0.25.1/hashmarks-0.25.1-py3-none-any.whl",
  "pydantic>=2.13.4",
  "pyyaml>=6.0.3",
  "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
]
quality = [
  "mypy>=1.17",
  "ruff>=0.12",
]
build = [
  "editables>=0.5",
  "hatchling>=1.32.0",
]

