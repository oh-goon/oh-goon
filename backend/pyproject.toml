[build-system]
requires = [
  "editables>=0.5",
  "hatchling>=1.32.0",
]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/oh_goon"]

[tool.hatch.build.targets.wheel.force-include]
"../templates/goons" = "oh_goon/templates/goons"
"../templates/plans" = "oh_goon/templates/plans"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.uv]
required-version = ">=0.10.0"
environments = [
  "python_version == '3.12'",
  "python_version == '3.13'",
  "python_version == '3.14'",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "../scripts/tests", "../tests/integration"]
extend-exclude = ["../frontend", "../generated"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-branches = 8
max-statements = 40
max-returns = 6
max-args = 6
max-locals = 15
max-bool-expr = 5

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Body",
  "fastapi.Cookie",
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Query",
  "fastapi.Security",
  "pydantic.Field",
]


[tool.mypy]
python_version = "3.12"
strict = true
packages = ["oh_goon"]
mypy_path = "src"
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/dependency_complete", "tests/integration"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
markers = [
  "slow: intentionally slower behavioral tests excluded from the inner development gate",
  "process: real child-process lifecycle tests excluded from the inner development gate",
  "scale: intentionally large-count concurrency/scale regression tests",
  "certification: real-server/process certification owned by explicit acceptance targets, not the normal tooling unit gate",
  "host_dns: test requires working external DNS/network and is excluded from constrained-host diagnostics",
  "dependency_complete: test requires the fully materialized native project dependency environment",
]

[tool.coverage.run]
branch = true
source = ["src/oh_goon"]
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.oh-goon.hosted-diagnostic]
native-only-dependencies = ["hashmarks"]

[tool.oh-goon.validation]
lint = ["ruff-check", "mypy"]
format = ["ruff-format"]
tests = ["pytest"]

