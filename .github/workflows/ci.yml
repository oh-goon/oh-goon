name: Required checks

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  draft-feedback:
    name: draft-feedback
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Materialize committed locks
        run: make init
      - name: Run draft feedback
        run: make lint format-check architecture release-locks-check
  checks:
    # Job conditions run before matrix expansion. A draft's skipped stub must
    # never publish one of the seven required check names as a skipped success.
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'full-checks-pending-review' || matrix.target }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - backend-check
          - frontend-check
          - tooling-check
          - architecture
          - check-generated
          - test-integration
        include:
          - target: backend-check
            backend_test_roots: tests/unit tests/dependency_complete
    env:
      UV_PYTHON: "3.12"
      BACKEND_CHECK_TEST_ROOTS: ${{ matrix.backend_test_roots || '' }}
      PYTEST_ADDOPTS: >-
        ${{ matrix.target == 'test-integration'
            && '-vv --maxfail=1 --durations=40 --durations-min=0.05 -o faulthandler_timeout=120 -o faulthandler_exit_on_timeout=false'
            || matrix.target == 'backend-check'
            && '--maxfail=1 --durations=40 --durations-min=0.05'
            || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Install native test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap ripgrep
          # Native Bubblewrap tests need user namespaces on this disposable VM.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Materialize committed locks
        run: make init
      - name: Run required check
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            backend-check|test-integration)
              # The hosted image's optional Android SDK is outside this repo's
              # Python/Node/Git test runtime. Validate the actual smaller view;
              # never cache metadata or skip validation of exposed paths.
              test "${RUNNER_ENVIRONMENT:-}" = github-hosted
              sdk_root=/usr/local/lib/android/sdk
              if [ -e "$sdk_root" ] || [ -L "$sdk_root" ]; then
                test -d "$sdk_root"
                test "$(readlink -e "$sdk_root")" = "$sdk_root"
                if mountpoint -q -- "$sdk_root"; then
                  echo "CI SDK overlay target is already mounted" >&2
                  exit 1
                fi
                sdk_source="oh-goon-ci-sdk-$GITHUB_RUN_ID-$$"
                sdk_mounted=0
                cleanup_sdk() {
                  check_status=$?
                  trap - EXIT INT TERM
                  if sdk_current_source=$(findmnt -rn --first-only --direction backward --target "$sdk_root" --output SOURCE) &&
                    [ "$sdk_current_source" = "$sdk_source" ]; then
                    if sudo umount -- "$sdk_root"; then
                      echo "CI SDK overlay released"
                    else
                      echo "CI SDK overlay cleanup failed" >&2
                      if [ "$check_status" = 0 ]; then check_status=1; fi
                    fi
                  elif [ "$sdk_mounted" = 1 ]; then
                    echo "CI SDK overlay cleanup ownership is unverified" >&2
                    if [ "$check_status" = 0 ]; then check_status=1; fi
                  fi
                  exit "$check_status"
                }
                trap cleanup_sdk EXIT
                trap 'exit 130' INT
                trap 'exit 143' TERM
                sudo mount -t tmpfs -o ro,nodev,nosuid,noexec,size=4k "$sdk_source" "$sdk_root"
                sdk_mounted=1
                findmnt -rn --first-only --direction backward --target "$sdk_root" --output SOURCE,FSTYPE,OPTIONS
                sdk_identity=$(stat -Lc '%d:%i' "$sdk_root")
                bwrap --unshare-user --unshare-pid --unshare-net --die-with-parent --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 --proc /proc --dev /dev -- /usr/bin/python3 -I -S - "$sdk_identity" <<'PY'
          import os
          import sys
          path = "/usr/local/lib/android/sdk"
          metadata = os.stat(path)
          assert f"{metadata.st_dev}:{metadata.st_ino}" == sys.argv[1]
          assert os.statvfs(path).f_flag & os.ST_RDONLY
          with os.scandir(path) as entries:
              assert next(entries, None) is None
          print("Native SDK overlay identity, emptiness and read-only view verified")
          PY
              fi
              ;;
          esac
          make "${{ matrix.target }}"
          if [ "${{ matrix.target }}" = test-integration ]; then
            make test-python-projects
          fi
  release:
    # A draft must never publish a skipped success under a required check name.
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'release-pending-review' || 'build-release' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Materialize committed locks
        run: make init
      - name: Assemble checked source
        run: make assemble-release
