name: Required checks

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  draft-feedback:
    name: draft-feedback
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Materialize committed locks
        run: make init
      - name: Run draft feedback
        run: make lint format-check architecture release-locks-check
  checks:
    # Job conditions run before matrix expansion. A draft's skipped stub must
    # never publish one of the seven required check names as a skipped success.
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'full-checks-pending-review' || matrix.target }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - backend-check
          - frontend-check
          - tooling-check
          - architecture
          - check-generated
          - test-integration
        include:
          - target: backend-check
            backend_test_roots: tests/unit tests/dependency_complete
    env:
      UV_PYTHON: "3.12"
      BACKEND_CHECK_TEST_ROOTS: ${{ matrix.backend_test_roots || '' }}
      PYTEST_ADDOPTS: ${{ (matrix.target == 'backend-check' || matrix.target == 'test-integration') && '--maxfail=1 --durations=40 --durations-min=0.05' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Install native test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap ripgrep
          # Native Bubblewrap tests need user namespaces on this disposable VM.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Materialize committed locks
        run: make init
      - name: Run required check
        run: make "${{ matrix.target }}"
  release:
    # A draft must never publish a skipped success under a required check name.
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'release-pending-review' || 'build-release' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Materialize committed locks
        run: make init
      - name: Assemble checked source
        run: make assemble-release
