name: Matched cold bind diagnostic

"on":
  push:
    branches: [codex/cold-bind-profile-v10]

permissions:
  contents: read

concurrency:
  group: cold-bind-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.12"
      OH_GOON_PROFILE_BASE: bd3b60a2f7151e62c0df1f7625ce608e57d24d93
      OH_GOON_PROFILE_CANDIDATE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Select disposable hosted environment
        run: |
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap ripgrep strace
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Materialize committed locks once
        run: make init
      - name: Attribute one cold baseline preflight to native filesystem work
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          umask 077
          bench_root="$RUNNER_TEMP/cold-bind-profile"
          bench_target="backend/src/oh_goon/integrations/fleet_plan_bubblewrap_isolation.py"
          mkdir -p "$bench_root"
          cp "$bench_target" "$bench_root/restore.py"
          trap 'cp "$bench_root/restore.py" "$bench_target"' EXIT
          git show "$OH_GOON_PROFILE_BASE:$bench_target" > "$bench_target"
          cat > "$bench_root/observe.py" <<'PY'
          import json, resource, time
          import pytest
          from oh_goon.integrations import fleet_plan_bubblewrap_isolation as module
          native = module._require_standard_bind_structure
          samples = []
          def observed(root, **kwargs):
              before = resource.getrusage(resource.RUSAGE_SELF)
              started = time.perf_counter()
              try:
                  return native(root, **kwargs)
              finally:
                  after = resource.getrusage(resource.RUSAGE_SELF)
                  samples.append({"root": str(root), "elapsed": time.perf_counter() - started, "user_cpu": after.ru_utime - before.ru_utime, "system_cpu": after.ru_stime - before.ru_stime, "input_blocks": after.ru_inblock - before.ru_inblock, "voluntary_switches": after.ru_nvcsw - before.ru_nvcsw})
          module._require_standard_bind_structure = observed
          result = pytest.main(["-c", "backend/pyproject.toml", "-o", "addopts=", "-q", "backend/tests/unit/entrypoints/test_cli_ai.py::test_native_bubblewrap_preflight_retains_canonical_git_root", "--durations=1"])
          print("OH_GOON_NATIVE_WALK_ATTRIBUTION=" + json.dumps({"samples": samples, "exit": result}, sort_keys=True))
          raise SystemExit(result)
          PY
          sync
          printf '3\n' | sudo tee /proc/sys/vm/drop_caches > /dev/null
          uv run --offline --frozen --no-sync --project backend strace -c -w -e trace=stat,lstat,newfstatat,statx,fstat,getdents64,openat,close,read -o "$bench_root/native-summary.txt" backend/.venv/bin/python "$bench_root/observe.py"
          cat "$bench_root/native-summary.txt"
