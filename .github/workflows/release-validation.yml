name: Complete release verification

"on":
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-regression:
    name: release-check
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Install native test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Prepare native test CPU control
        run: |
          # This disposable runner owns its native systemd user manager.
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          runner_uid=$(id -u)
          sudo loginctl enable-linger "$runner_uid"
          sudo systemctl start "user@$runner_uid.service"
          test -S "/run/user/$runner_uid/bus"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\n' "$runner_uid" >> "$GITHUB_ENV"
          printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$runner_uid" >> "$GITHUB_ENV"
      - name: Materialize committed locks
        run: make init
      - name: Verify the complete portable suite
        run: make release-check
