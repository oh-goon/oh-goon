schema_version: 1
source_version: 1267.0.1052
section: execution-safety
questions:
- id: Q11
  severity: critical
  expected_claims:
  - id: concept
    statement: Repository/path isolation is backend execution safety and a trust boundary, owned at backend/integration/runtime boundaries rather than frontend presentation.
    critical: true
  - id: ownership_boundary
    statement: It is security behavior, not a convenience check or UI policy.
    critical: true
  - id: consequence
    statement: A path leak can expose code/workspaces outside an agent or execution assignment.
    critical: true
  contradictions:
  - id: fatal-01
    statement: Treats repository/path isolation as convenience or UI policy rather than backend execution security/trust authority.
    severity: critical
    misconception_id: caller_owner_confusion
  evidence_expectations:
  - backend/AGENTS.md:68-76
  - AGENTS.md:63-89
  - backend/src/oh_goon/services/fleet_admission.py:148-169
- id: Q12
  severity: normal
  expected_claims:
  - id: concept
    statement: make certify delegates to CERTIFICATION_FRONTDOOR, which uses scripts/run_logged.sh certify around one locked uv/pyproject oh-goon-workflow runner; the backend certification frontdoor bootstraps authority and invokes the single APP Plan at templates/plans/oh-goon/app-certification/plan.yml.
    critical: false
  - id: ownership_boundary
    statement: APP Goon ordering belongs only to the APP Plan; Make/workflow must not duplicate Plan orchestration.
    critical: false
  - id: consequence
    statement: Preserves a single certification orchestration owner and first-failure semantics.
    critical: false
  contradictions: []
  evidence_expectations:
  - Makefile:3-8
  - Makefile:400-401
  - docs/development/APP_CERTIFICATION.md:1-35
  - backend/src/oh_goon/workflow.py:14-31
  - backend/src/oh_goon/workflow.py:489-513
- id: Q13
  severity: critical
  expected_claims:
  - id: concept
    statement: make certify never runs sudo, silently changes host configuration, or acquires strict executor authority. Explicit one-time WSL strict-executor host mutation is make strict-executor-setup.
    critical: true
  - id: ownership_boundary
    statement: Strict-executor host repair/setup is explicit and separate from APP verification.
    critical: true
  - id: consequence
    statement: Certification must not gain hidden host mutation authority.
    critical: true
  contradictions:
  - id: fatal-01
    statement: Allows make certify to run sudo or silently mutate host configuration.
    severity: critical
    misconception_id: semantic_invariant_violation
  evidence_expectations:
  - docs/development/APP_CERTIFICATION.md:1-35
  - scripts/tests/test_run_logging.py:151-162
- id: Q14
  severity: critical
  expected_claims:
  - id: concept
    statement: "backend API source \u2192 FastAPI/OpenAPI \u2192 generated/openapi/openapi.json \u2192 generated/frontend/ \u2192 frontend."
    critical: true
  - id: ownership_boundary
    statement: No hand-repeated endpoint/request/response facts in frontend and no backend dependency on frontend.
    critical: true
  - id: consequence
    statement: Maintains one cross-boundary contract authority.
    critical: false
  contradictions:
  - id: fatal-01
    statement: Allows authored frontend code to recreate or hand-maintain backend API contract facts.
    severity: critical
    misconception_id: duplicate_owner_assumption
  - id: fatal-02
    statement: Makes backend/API authority depend on authored frontend or generated frontend consumers, reversing the canonical backend-to-generated-to-frontend dependency direction.
    severity: critical
    misconception_id: dependency_direction_reversal
  evidence_expectations:
  - AGENTS.md:143-149
  - backend/src/oh_goon/repository_tooling/generation/export_openapi.py:13-47
  - backend/src/oh_goon/repository_tooling/generation/generate_api_types.py:29-99
- id: Q15
  severity: normal
  expected_claims:
  - id: concept
    statement: Schedule = explicit repository target set + one resolved Plan + active/paused wall-clock interval. ScheduleService owns that public model; ScheduleScheduler owns periodic invocation only, and startup is not a trigger.
    critical: false
  - id: ownership_boundary
    statement: Shared Runs remain the many-repository path; scheduler/Schedule must not become a second execution graph.
    critical: false
  - id: consequence
    statement: Prevents scheduling from mirroring Plan execution and repository selection semantics.
    critical: false
  contradictions: []
  evidence_expectations:
