- id: Q203
  severity: critical
  expected_claims:
  - id: concept
    statement: Hashmarks owns verification selection/relevance evidence only; Oh-Goon owns process launch, timeout/isolation, verification-result authority, and certification. Selecting a test does not authorize, execute, or certify it.
    critical: true
  - id: ownership_boundary
    statement: Verification-selection authority and verification-result authority are separate planes and neither may silently absorb the other.
    critical: true
  - id: consequence
    statement: Treating selection as execution would let repository evidence bypass admission, runtime policy, result acceptance, and certification.
    critical: true
  contradictions:
  - id: boundary-01
    statement: Claims that Hashmarks selecting a relevant test authorizes or executes that test, or that Oh-Goon should independently choose repository verification relevance.
    severity: critical
    misconception_id: duplicate_owner_assumption
  evidence_expectations:
  - AGENTS.md:93-128
  - backend/src/oh_goon/integrations/hashmarks/verification_selection.py:57-83
  - backend/src/oh_goon/repository_tooling/hashmarks_verification_execution.py:21-78

- id: Q207
  severity: normal
  expected_claims:
  - id: concept
    statement: "Hashmarks owns the exact flat logical verification membership it selected. Oh-Goon may change physical execution grouping after timeout, but every refinement must conserve the admitted membership: child union equals parent membership with no omission, duplicate, extra, or independent reselection."
    critical: true
  - id: ownership_boundary
    statement: Timeout/refinement and physical batching belong to Oh-Goon; logical verification-membership selection remains frozen Hashmarks repository evidence.
    critical: true
  - id: consequence
    statement: Prevents an execution recovery optimization from silently becoming a second verification selector.
    critical: false
  contradictions:
  - id: boundary-01
    statement: Allows Oh-Goon timeout bisection to drop, duplicate, add, or independently reselect Hashmarks test membership.
    severity: critical
    misconception_id: identity_scope_confusion
  evidence_expectations:
  - AGENTS.md:113-120
  - backend/src/oh_goon/repository_tooling/hashmarks_verification_execution.py:21-78
  - backend/src/oh_goon/runtime/execution/shards.py:124-159

- id: Q212
  severity: normal
  expected_claims:
  - id: concept
    statement: Timeout, retry/resume, worker concurrency, scheduling, machine placement, environment recovery, and result authority belong to Oh-Goon's execution/certification plane and are forbidden as Hashmarks repository-work authority.
    critical: true
  - id: ownership_boundary
    statement: Oh-Goon admits only the exact frozen native Hashmarks downstream-contract and selection-envelope schemas and must reject extra execution-policy/layout fields rather than honoring them.
    critical: true
  - id: consequence
    statement: Exact-shape admission prevents a repository-evidence producer from smuggling runtime authority into the execution plane.
    critical: false
  contradictions:
  - id: boundary-01
    statement: Honors Hashmarks-provided timeout, retry, concurrency, scheduling, placement, or recovery policy because the envelope identity is otherwise valid.
    severity: critical
    misconception_id: semantic_invariant_violation
  evidence_expectations:
  - backend/src/oh_goon/integrations/hashmarks/verification_selection_primitives.py:101-136
  - backend/src/oh_goon/repository_tooling/hashmarks_shard_execution.py:84-153
  - AGENTS.md:93-120
