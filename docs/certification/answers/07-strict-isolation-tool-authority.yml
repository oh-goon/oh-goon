- id: Q209
  severity: normal
  expected_claims:
  - id: concept
    statement: Hashmarks v0.13.0 owns exact flat logical verification membership and explicitly leaves physical execution layout external; process isolation, grouping, concurrency, retry, and timeout refinement are Oh-Goon execution-policy decisions.
    critical: true
  - id: ownership_boundary
    statement: Hashmarks may not smuggle `isolated_process`, batching, or other execution-layout policy into its admitted downstream contract/envelope; Oh-Goon must reject such extra fields and preserve the exact selected membership while materializing its own ShardWork.
    critical: true
  - id: consequence
    statement: Keeping layout external prevents repository intelligence from becoming execution authority while exact membership conservation prevents Oh-Goon execution policy from becoming a second verification selector.
    critical: false
  contradictions:
  - id: boundary-01
    statement: Claims Hashmarks may dictate physical isolation/grouping, or allows Oh-Goon grouping/isolation choices to omit, duplicate, add, or independently reselect admitted Hashmarks members.
    severity: critical
    misconception_id: test_as_runtime_authority
  evidence_expectations:
  - AGENTS.md:113-120
  - backend/src/oh_goon/integrations/hashmarks/verification_selection_primitives.py:101-136
  - backend/src/oh_goon/repository_tooling/hashmarks_verification_execution.py:21-78
  - backend/src/oh_goon/runtime/execution/shard_models.py:79-113
