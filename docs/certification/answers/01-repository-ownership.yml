- id: Q210
  severity: normal
  expected_claims:
  - id: concept
    statement: New repository-intelligence capabilities belong in Hashmarks, not in Oh-Goon. Oh-Goon may consume only a frozen, versioned Hashmarks evidence contract needed for admission, execution, certification, or projection.
    critical: true
  - id: ownership_boundary
    statement: An integrations/hashmarks adapter is a thin consumer and must not become a local prototype or extension point for CodeMap, impact, ranking, context selection, verification relevance, repository-negative recovery, or shard-membership behavior.
    critical: true
  - id: consequence
    statement: This keeps repository-evidence evolution independent from Oh-Goon's execution/certification control plane and prevents duplicate ownership.
    critical: false
  contradictions:
  - id: boundary-01
    statement: Recommends implementing or experimenting with a new Hashmarks-specific repository-intelligence feature inside Oh-Goon first and upstreaming it later.
    severity: critical
    misconception_id: duplicate_owner_assumption
  evidence_expectations:
  - AGENTS.md:104-111
  - backend/src/oh_goon/repository_tooling/architecture/hashmarks_harness_boundary_contract.py:50-78

- id: Q211
  severity: normal
  expected_claims:
  - id: concept
    statement: Solution reasoning and editing belong to the coding agent/harness. Hashmarks supplies repository evidence and Oh-Goon supplies execution/certification control; neither decides what source change should be made.
    critical: true
  - id: ownership_boundary
    statement: Repository evidence may constrain or inform the coding agent, and execution policy may admit or reject its work, but neither plane may turn those responsibilities into solution authorship.
    critical: true
  - id: consequence
    statement: Separating the solution plane prevents repository retrieval or certification policy from becoming a hidden autonomous coding agent.
    critical: false
  contradictions:
  - id: boundary-01
    statement: Claims Hashmarks should choose the code edit because it knows the repository, or Oh-Goon should choose the edit because it controls execution/certification.
    severity: critical
    misconception_id: caller_owner_confusion
  evidence_expectations:
  - AGENTS.md:93-102
  - backend/src/oh_goon/repository_tooling/architecture/hashmarks_harness_boundary_contract.py:50-78

- id: Q213
  severity: normal
  expected_claims:
  - id: concept
    statement: Executable repository Python is pyproject-owned under backend/src/oh_goon/repository_tooling and is exposed through a named backend project entrypoint invoked with uv; scripts/ is deliberately not a second Python package.
    critical: true
  - id: ownership_boundary
    statement: scripts/ may contain shell or JavaScript launch support, repository-tooling tests, and documentation, while executable Python modules and parallel import surfaces under scripts/ are forbidden.
    critical: true
  - id: consequence
    statement: Keeping one Python ownership and invocation surface prevents repository tooling from gaining a second dependency, import, and execution authority.
    critical: false
  contradictions:
  - id: boundary-01
    statement: Recommends an importable or executable scripts/audit Python package because scripts/ broadly owns repository tooling.
    severity: critical
    misconception_id: duplicate_owner_assumption
  evidence_expectations:
  - scripts/README.md:3-20
  - AGENTS.md:9-24

- id: Q216
  severity: normal
  expected_claims:
  - id: concept
    statement: LOC, fan-in, fan-out, and similar complexity metrics are investigation signals, not proof that a module is a God Object or must be split.
    critical: true
  - id: ownership_boundary
    statement: A candidate must be classified by responsibility as KEEP COHESIVE, REFACTOR INTERNALLY, EXTRACT RESPONSIBILITY, or DECOMPOSE MULTIPLE RESPONSIBILITIES, while preserving authority and invariant locality before any extraction is justified.
    critical: true
  - id: consequence
    statement: A hard numeric split rule can scatter durable or execution authority, create mechanical modules, and make ownership harder rather than safer.
    critical: false
  contradictions:
  - id: metric-01
    statement: Treats an inbound-import or LOC threshold as sufficient evidence that decomposition is required without responsibility and authority-locality analysis.
    severity: critical
    misconception_id: semantic_invariant_violation
  evidence_expectations:
  - docs/RESPONSIBILITY_COMPLEXITY_REFACTORING.md:7-12
  - AGENTS.md:209-213
