schema_version: 1
source_version: 1267.0.1052
section: repository-ownership
questions:
- id: Q01
  severity: normal
  expected_claims:
  - id: concept
    statement: API routes/schemas and HTTP translation belong in backend/src/oh_goon/api; semantic work delegates to the owning service/core fact; focused backend API behavior tests belong in backend/tests/unit/api.
    critical: false
  - id: ownership_boundary
    statement: API must not become the owner of product semantics.
    critical: false
  - id: consequence
    statement: Prevents HTTP translation from becoming a second product-semantics owner.
    critical: false
  - id: change_impact
    statement: A response-contract change should exercise focused backend API behavior and generated-contract reproduction, while service/core semantics stay untouched unless the underlying product fact changes.
    critical: false
  contradictions:
  - id: trap-01
    statement: Treats backend API routes/schemas or HTTP translation as the owner of product semantics instead of delegating semantic work to the owning service/core fact.
    severity: normal
    misconception_id: caller_owner_confusion
  evidence_expectations:
  - backend/src/oh_goon/README.md:31-39
  - AGENTS.md:177-200
- id: Q02
  severity: normal
  expected_claims:
  - id: concept
    statement: Start in services/fleet_plan_* resolution owners; change core models/policy only when the durable/framework-independent fact itself changes.
    critical: false
  - id: ownership_boundary
    statement: Services compose resolution; core owns facts, not orchestration.
    critical: false
  - id: consequence
    statement: Keeps orchestration out of core and prevents duplicate resolution authorities.
    critical: false
  - id: change_impact
    statement: Resolution-semantic changes should exercise resolver/compilation contracts and their focused tests; runtime execution must continue consuming the resolved representation rather than becoming a second resolver.
    critical: false
  contradictions:
  - id: trap-01
    statement: Moves Plan/Goon resolution orchestration into core or runtime execution merely because those layers consume the resolved fact, creating a second resolver/owner.
    severity: normal
    misconception_id: duplicate_owner_assumption
  evidence_expectations:
  - backend/src/oh_goon/README.md:41-43
  - backend/src/oh_goon/README.md:57-59
  - backend/src/oh_goon/README.md:83-84
- id: Q03
  severity: normal
  expected_claims:
  - id: concept
    statement: Open features/<feature>/*Feature.ts or *Feature.tsx first; it is the single top-level composition entrypoint for the capability and reveals its private components/hooks/models.
    critical: false
  - id: ownership_boundary
    statement: A feature owns its private implementation; navigation starts at composition rather than random leaf files.
    critical: false
  - id: consequence
    statement: Improves bounded context and avoids cross-feature private imports.
    critical: false
  - id: change_impact
    statement: A frontend-local capability change should move with its feature-local tests; backend API and generated contract authority remain untouched when no contract fact changes.
    critical: false
  contradictions:
  - id: trap-01
    statement: Treats an arbitrary frontend leaf/shared file as the capability owner and bypasses the feature composition entrypoint/private-boundary ownership model.
    severity: normal
    misconception_id: caller_owner_confusion
  evidence_expectations:
  - frontend/src/README.md:40-53
  - frontend/src/README.md:65-67
- id: Q04
  severity: normal
  expected_claims:
  - id: concept
    statement: Frontend presentation/feature changes stay local with colocated tests plus frontend check; when a generated contract fact changes, stop at the boundary, change backend/API or generator authority, regenerate/check generated contracts, then return to frontend consumption.
    critical: false
  - id: ownership_boundary
    statement: Frontend must not recreate missing backend/generated facts.
    critical: false
  - id: consequence
    statement: Prevents authored frontend code from becoming a mirror API schema.
    critical: false
  - id: change_impact
    statement: Frontend-local behavior should exercise frontend checks/tests; a real contract change must update backend/generator authority and regenerate outputs, never hand-edit generated artifacts as the workaround.
    critical: false
  contradictions:
  - id: trap-01
    statement: Treats authored frontend code or a hand-edited generated artifact as an alternate owner of a missing backend/generated contract fact.
    severity: normal
    misconception_id: duplicate_owner_assumption
  evidence_expectations:
  - frontend/src/README.md:108-124
- id: Q05
  severity: normal
  expected_claims:
  - id: concept
    statement: "Shipped Goons live at templates/goons/<category>/<name>/{goon.yml,README.md}; Plans mirror that under templates/plans. Canonical Goon identity is exactly category/name from the package path. Shipped Goon YAML omits name and description; if general Goon authoring supplies name, it must match the expected package basename."
    critical: false
  - id: ownership_boundary
    statement: "No lookup aliases, hidden prefixes, fallback lookup, or third classification level. An import-local as: label names one occurrence without changing its package identity or lookup."
    critical: false
  - id: consequence
    statement: Identity drift is a provenance and ownership defect.
    critical: false
  contradictions:
  - id: trap-01
    statement: Treats aliases, hidden prefixes, fallback lookup, or another path spelling as equivalent template identity authority despite the canonical category/name package identity.
    severity: normal
    misconception_id: hidden_fallback_assumption
  evidence_expectations:
  - AGENTS.md:151-166
  - backend/src/oh_goon/integrations/fleet_plan_goon_authoring.py:46-57
