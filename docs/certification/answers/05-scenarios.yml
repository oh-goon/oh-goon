- id: Q35
  severity: critical
  expected_claims:
  - id: concept
    statement: Invalid if the proposed fix adds a second resolver/cache/materialization path or makes APP certification reacquire dependencies already established by canonical `make init`.
    critical: true
  - id: ownership_boundary
    statement: Native uv/npm own package acquisition and retry/TLS/registry semantics during initialization; APP certification consumes the initialized repository and must not own dependency acquisition or host-unrestricted package-manager egress.
    critical: true
  - id: consequence
    statement: Registry/TLS availability after successful initialization cannot become an APP prerequisite merely because certification discarded the established environment and attempted to rebuild it.
    critical: true
  contradictions:
  - id: fatal-01
    statement: Adds a certification-specific resolver/cache/download/materialization path or broadens APP egress to compensate for discarded initialization authority.
    severity: critical
    misconception_id: semantic_invariant_violation
