- id: Q172
  severity: critical
  expected_claims:
  - id: concept
    statement: Invalid if the proposed fix introduces a second dependency resolver/cache or broadens APP verification capability. Canonical `make init`
      owns dependency acquisition before certification; the APP verification Plan consumes the initialized repository and must not reacquire packages
      or gain host-unrestricted egress merely to repeat materialization.
    critical: true
  - id: ownership_boundary
    statement: uv/npm own package acquisition and retry semantics at canonical initialization; APP certification owns verification of the initialized
      product and keeps its semantic Goons scoped to the capabilities their verification actually requires.
    critical: true
  - id: consequence
    statement: A registry/TLS failure during canonical initialization is reported by the native owner instead of being hidden by a repository-owned
      download/cache fallback; after successful initialization, registry availability is not a prerequisite for reacquiring the same APP dependencies.
    critical: true
  - id: reasoning_extension
    statement: Use repository evidence to distinguish native semantic authority from Oh-Goon orchestration and do not invent a second source of
      truth.
    critical: false
  contradictions:
  - id: fatal-01
    statement: Adds a second resolver/cache/download path, moves dependency acquisition back inside APP certification, or grants host-unrestricted
      egress to verification Steps merely to reacquire already-materialized dependencies.
    severity: critical
    misconception_id: semantic_invariant_violation
  evidence_expectations:
