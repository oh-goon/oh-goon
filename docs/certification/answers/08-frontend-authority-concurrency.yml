schema_version: 1
source_version: 1267.0.1052
section: frontend-authority-concurrency
questions:
- id: Q46
  severity: critical
  expected_claims:
  - id: concept
    statement: Backend models and generated contracts own execution, verification, admission, Run status, evidence, and safety. Frontend may search/filter/preserve navigation/request verification/summarize returned facts, but may not create a parallel readiness/admission/wizard state machine or reinterpret blocked selection as partial execution.
    critical: true
  - id: ownership_boundary
    statement: Browser state projects backend truth; it does not manufacture execution semantics.
    critical: true
  - id: consequence
    statement: Prevents frontend mirror-state from becoming a competing execution authority.
    critical: true
  contradictions:
  - id: fatal-01
    statement: Allows browser/frontend state to manufacture backend execution, admission, Run status, or evidence semantics.
    severity: critical
    misconception_id: observer_authority_confusion
  evidence_expectations:
  - frontend/src/README.md:28-38
  - frontend/src/domain/concurrency/PendingCommandIdentitySet.ts:3-6
  - frontend/src/domain/concurrency/MutationController.ts:52-72
  - backend/src/oh_goon/core/models/game_tape.py:278-296
- id: Q47
  severity: normal
  expected_claims:
  - id: concept
    statement: app/pages/runReviewState.ts plus RunsPage own durable Run-review browser state. Game Tape/Flow/Timeline/Logs/inspector consume it; backend Run/Step/evidence identity remains canonical and URL state must be normalized against the loaded Run.
    critical: false
  - id: ownership_boundary
    statement: Durable presentation state has one owner and cannot replace backend identity.
    critical: false
  - id: consequence
    statement: Prevents multiple review-state mirrors and stale URL identity from selecting the wrong evidence.
    critical: false
  contradictions: []
  evidence_expectations:
  - frontend/AGENTS.md:78-83
  - frontend/src/app/pages/runReviewState.ts:29-56
  - frontend/src/app/pages/runReviewState.ts:164-199
- id: Q48
  severity: critical
  expected_claims:
  - id: concept
    statement: READ_RESOURCES owns scope/resource mapping, ReadController owns concurrency and mounted owner leases, useReadResource owns mounted refresh, and mutation reporting owns invalidation. A saved mutation must not be followed by a second manual refresh unless the user explicitly requested Refresh/Retry.
    critical: true
  - id: ownership_boundary
    statement: Every read lifecycle responsibility has one owner.
    critical: true
  - id: consequence
    statement: Prevents duplicate requests, races, and multiple components claiming the same read scope.
    critical: true
  contradictions:
  - id: fatal-01
    statement: Creates multiple owners for read lifecycle/concurrency/leases instead of the canonical read-resource/controller chain.
    severity: critical
    misconception_id: duplicate_owner_assumption
  evidence_expectations:
  - frontend/AGENTS.md:80-83
  - frontend/src/domain/concurrency/ReadController.ts:31-65
- id: Q49
  severity: critical
  expected_claims:
  - id: concept
    statement: No. Once the server confirms a write, navigation/presentation relevance cannot erase that side effect. MutationController advances causality for every successful command; commit observers are advisory invalidation hooks and observer failure cannot turn a saved write into a client-side failure.
    critical: true
  - id: ownership_boundary
    statement: Mutation outcome is owned by the completed write; presentation and invalidation are downstream consumers.
    critical: true
  - id: consequence
    statement: Prevents asynchronous UI context from rewriting durable command outcome.
    critical: true
  contradictions:
  - id: fatal-01
    statement: Allows navigation or presentation relevance to erase/reclassify an already confirmed mutation side effect.
    severity: critical
    misconception_id: semantic_invariant_violation
  evidence_expectations:
  - frontend/src/domain/concurrency/MutationController.ts:62-78
  - frontend/src/domain/concurrency/MutationController.ts:98-108
- id: Q50
  severity: normal
  expected_claims:
  - id: concept
    statement: "Location text alone is ABA-unsafe because A\u2192B\u2192A can make an old A completion look current. PresentationLocationAuthority increments a generation on each navigation transition and ownership requires both location and generation to match."
    critical: false
  - id: ownership_boundary
    statement: Async presentation relevance is identity+generation, not text equality.
    critical: false
  - id: consequence
    statement: Prevents stale async completion feedback from attaching to a later view with the same URL text.
    critical: false
  contradictions: []
  evidence_expectations:
  - frontend/src/domain/concurrency/PresentationLocationAuthority.ts:1-35
- id: Q183
  severity: critical
  expected_claims:
  - id: concept
    statement: Backend models and generated contracts own execution, verification, admission, Run status, evidence, and safety. Frontend may search/filter/preserve navigation/request verification/summarize returned facts, but may not create a parallel readiness/admission/wizard state machine or reinterpret blocked selection as partial execution.
