  - id: ownership_boundary
    statement: LocalLaunchBindingStore owns only the exact workspace-to-launch reference and conservative replacement rule; LocalLaunchEventStore
      owns durable launch events; Launch Manifest projection owns lifecycle truth; SafeLaunchStatus owns credential-free presentation; CLI status
      owns deterministic lookup and rendering. None of these layers may discover processes, select by recency, kill/attach/restart a process,
      or infer terminal state from absence. At the 1267.0.38 boundary, process-birth identity and live-owner proof were intentionally deferred;
      they subsequently landed and are tested by Q137.
    critical: false
  - id: consequence
