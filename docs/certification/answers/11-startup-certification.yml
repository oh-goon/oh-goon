- id: Q131
  severity: normal
  expected_claims:
  - id: concept
    statement: 'First-checkout `make init` must not place a repository-owned filesystem/cache admission or bootstrap state machine in front of
      native uv/npm. Make invokes the native materializers directly; uv/npm remain resolver/cache/lock/environment authorities and prove whether
      their real operations can run by actually performing them. When a native operation fails, Oh-Goon preserves that cause and exit semantics
      and must not retry it through a shadow loop, redirect native caches, repair permissions/mounts, substitute another installer/environment,
      or treat classification as admission. `make init-doctor` is an explicit diagnostic-only create/write/fsync/delete probe whose PASS/FAIL
      is never bootstrap evidence and is never invoked automatically by `make init`. Certification mutable state remains different: because a
      long authoritative Oh-Goon run exists after installation, its existing backend bootstrap owner must prove the selected isolated state root
      writable before Plan admission, and runtime EROFS/EIO/ENOSPC/EDQUOT or storage-shaped SQLite loss must remain one bounded environment failure
      whose primary cause cannot be replaced by diagnostic/shutdown persistence failures.'
    critical: false
  - id: ownership_boundary
    statement: Before Oh-Goon is installed, the stdlib repository bootstrap only delegates and observes; native uv/npm own their actual bootstrap
      operations, while init-doctor owns optional diagnostics with zero admission/evidence/recovery authority. After Oh-Goon exists, certification
      bootstrap owns certification-state placement and pre-admission writability, application/runtime storage handling owns mid-run classification/containment,
      and scripts/run_logged.sh remains non-authoritative presentation/persistence. Host mount health remains environment authority throughout.
    critical: false
  - id: consequence
    statement: Avoids duplicating uv's operational/storage model with a weaker preflight that can only prove create/write/fsync/delete, while
      retaining a useful explicit diagnostic for host-path troubleshooting. The same boundary prevents a physical WSL/Linux storage transition
      during an already-running certification from becoming a misleading source/Goon failure or traceback cascade.
    critical: false
  contradictions:
  - id: fatal-01
    statement: Wires init-doctor or any storage probe into `make init`, treats a doctor PASS as permission to skip native uv, retries or reroutes
      failed uv bootstrap through another cache/installer/environment, remounts or widens permissions to hide host failure, removes certification-state
      admission after Oh-Goon exists, treats runtime SQLite/storage loss as a Goon/source failure, or lets diagnostic/log persistence alter command/run
      semantics.
    severity: normal
    misconception_id: observer_authority_confusion
