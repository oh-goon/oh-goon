    statement: >
      Storage lifecycle must distinguish durable Oh-Goon certification/control state from unclassified bytes that happen to sit below an Oh-Goon cache root and from native package-manager caches that Oh-Goon does not own.
    critical: true
  - id: ownership_boundary
    statement: >
      storage_lifecycle.py owns the current durable application/certification inventory. Oh-Goon has no dependency-cache lifecycle or historical-cache recognizer: bytes below an Oh-Goon cache root without a current inventory owner are unclassified, reporting-only, and receive no automatic cleanup authority. Native uv/npm/Playwright caches remain native-tool authority.
    critical: true
  - id: consequence
    statement: >
