- id: Q80
  severity: critical
  expected_claims:
  - id: concept
    statement: Native tools own their native semantics. This rule is repository-wide, not package-manager-specific. uv/npm/Playwright, pytest/Ruff/mypy,
      Docker/BuildKit, Kubernetes and its API/CLI clients, Git, operating-system process facilities, and future native tools remain semantic owners
      of the operations they expose. Oh-Goon may order commands, transport already-resolved authority, provide isolated paths and bounded execution,
      retain identity/evidence, or fail closed around an Oh-Goon trust boundary, but it must not parse, normalize, edit, emulate, second-guess,
      or create a parallel state machine for an operation the native tool already owns. It must not respond to a blocked native semantic command
      by invoking an altered fallback command, synthesizing extra semantic cache/state, narrowing or broadening scope, or creating a second proof
      that claims the same native result; blocked required evidence remains INCOMPLETE. A helper is legitimate orchestration only when it enforces
      an independently named Oh-Goon-owned boundary without becoming a second implementation of the child tool's semantics.
    critical: true
  - id: ownership_boundary
    statement: Native tools own their operation semantics; Oh-Goon owns orchestration, isolation, authority transport, bounded execution, identity/evidence
      binding, and result classification only.
    critical: true
  - id: consequence
    statement: Prevents ghost owners that drift from package managers, container engines, cluster control planes, Git, process facilities, and
      other native tools; avoids duplicate work, contradictory identities, and synthetic success proofs.
    critical: true
  contradictions:
  - id: fatal-01
    statement: Reimplements any native-tool operation in Oh-Goon, treats a wrapper/mirror as co-authority with the native tool, or substitutes
      custom resolution/cache/install/build/test/lint/type/merge/rollout/process semantics when the native operation exists.
    severity: critical
    misconception_id: duplicate_owner_assumption
  evidence_expectations:
  - docs/development/NATIVE_TOOL_AUTHORITY.md:1-91
  - AGENTS.md:34-45
  - Makefile:1-340
  - backend/src/oh_goon/repository_tooling/dependency_locks.py:1-100
  - backend/src/oh_goon/repository_tooling/release/stamp_release_version.py:1-172
