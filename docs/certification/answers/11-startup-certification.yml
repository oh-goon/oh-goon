- id: Q61
  severity: normal
  expected_claims:
  - id: concept
    statement: Canonical dependency materialization happens once through native `make init` before APP certification. The APP verification Plan
      consumes that initialized repository; there is no certification-specific dependency bootstrap or reacquisition path.
    critical: false
  - id: ownership_boundary
    statement: Native uv/npm own dependency resolution, installation, cache, retry and network semantics. Oh-Goon owns Plan sequencing, explicit
      Step capabilities, isolation, durable execution evidence and PASS/FAIL/INCOMPLETE classification.
    critical: false
  - id: consequence
    statement: This prevents a shadow package-manager/certification-supply implementation while keeping broad diagnostics in `make verify` and
      the lean semantic `make certify` path release-critical.
    critical: false
  contradictions:
  - id: fatal-01
    statement: Reintroduces a certification-specific resolver, dependency cache/supply, offline replay authority, or mandatory `make certification-setup`
      path instead of delegating to native tools.
    severity: normal
    misconception_id: duplicate_owner_assumption
