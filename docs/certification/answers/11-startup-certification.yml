  - id: concept
    statement: The first runtime bridge must preserve the current native runtime owners while making their observable lifecycle facts structured.
      Contributor `LocalLaunchSupervisor` is the process-orchestration owner. Each backend/frontend child is launched through the tiny `oh-goon-local-launch-exec`
      bridge, which first writes generation-bound `service.spawned`, acknowledges that durable registration over a private inherited pipe, and
      only then `exec`s uvicorn or npm in that same PID. The supervisor does not admit the child to liveness/readiness observation until that
      acknowledgement arrives. This prevents immediate child exit or FastAPI lifespan startup from racing ahead of durable spawn evidence without
      reimplementing the native runtime. The FastAPI lifespan may assert only backend `service.startup_complete`; it cannot infer bind/readiness.
      Contributor readiness uses bounded positive HTTP observations of backend `/healthz` and the Vite endpoint; built `oh-goon start` keeps native
      `uvicorn.run(...)` and uses a read-only `/healthz` observer. Only successful observations may publish bound/ready and `launch.ready`. Readiness
      timeout and required child exit become structured failure events, while owner-issued stop/abort/fail events remain the only terminal authority.
      A late observer cannot overwrite an already terminal launch.
    critical: false
  - id: ownership_boundary
    statement: uvicorn owns server mechanics; npm/Vite own frontend execution/HMR; FastAPI/ApplicationRuntime owns application startup/background
      lifecycle; LocalLaunchSupervisor owns contributor process orchestration while the built CLI owns only its in-process native server call.
      LocalLaunchOwner/EventStore owns only generation-bound event publication and projection. The pre-exec bridge records the PID, acknowledges
      durable spawn registration, and transfers that exact process to the native tool with `exec`; it cannot supervise/retry/repair that native
      runtime. HTTP observers may establish positive readiness but cannot kill processes, infer terminal state from absence, parse logs, or store
      the local-access credential.
    critical: false
  - id: consequence
    statement: Prevents the Launch Manifest integration from creating a new process manager or promoting configured ports, child existence, arbitrary
      logs or ASGI startup into false readiness. It also removes the concrete startup race between child creation and lifespan evidence and gives
      coding agents a durable structured failure when readiness or a required service actually fails.
    critical: false
  contradictions:
  - id: fatal-01
    statement: Records spawn after starting the native runtime, lets startup/config/PID imply READY, parses Vite/uvicorn logs for lifecycle truth,
      allows a readiness observer to overwrite terminal state, stores the raw local-access token, or turns the bridge into a second server/HMR/process
      manager.
    severity: normal
    misconception_id: lifecycle_state_confusion
