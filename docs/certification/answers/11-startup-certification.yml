- id: Q134
  severity: normal
  expected_claims:
  - id: concept
    statement: The Phase-0 baseline had to describe the launch system that existed at that checkpoint rather than silently declaring the later
      architecture complete. Contributor `make dev` delegates process orchestration to `scripts/dev.sh`, which creates the local-access capability,
      launches uvicorn and npm/Vite children and owns shell-job teardown. Built `oh-goon start` separately owns its local-access capability, URL
      and uvicorn launch in `cli_start.py`. The FastAPI lifespan/ApplicationRuntime owns application background lifecycle only; it is not the
      OS process-tree owner. At that checkpoint this was an explicit duplicate local-launch ownership boundary plus readiness/launch-identity/generation
      gaps identified for later convergence without reimplementing uvicorn, npm or Vite. The Phase-1 `LaunchManifest` is therefore a versioned
      read model (`oh-goon.launch/v1`) whose requested intent is structurally separate from observations. An observed runtime fact carries who
      asserted it, observation time, owner generation and where relevant service generation, so a configured port, stale PID or prior service
      instance cannot become current runtime proof. The model contains no process-launch calls or raw local-access token field; secret/enforcement
      authority remains outside the manifest.
    critical: false
  - id: ownership_boundary
    statement: In the Phase-0 baseline, Make was a convenience/delegating caller and the contributor shell and built CLI paths were the separate
      launch owners pending later proven convergence; uvicorn/Vite/npm retain native runtime mechanics; FastAPI/ApplicationRuntime owns application
      lifecycle; local-access middleware owns enforcement. Launch Manifest owns only typed representation/serialization of resolved intent and
      authoritative observations and cannot execute processes, grant authority, issue credentials or infer readiness from logs/configuration.
    critical: false
  - id: consequence
    statement: Prevents Launch Manifest work from creating a third launcher or falsely treating configured endpoints, PIDs, tokens or presentation
      text as canonical runtime truth. It also made the Phase-0 duplicate ownership debt explicit so later migration could remove it rather than
      preserving two competing process owners behind a new status layer.
    critical: false
  contradictions:
