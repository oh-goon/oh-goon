- id: Q137
  severity: normal
  expected_claims:
  - id: concept
    statement: 'A PID is only an address in the process table and may be reused, so a nonterminal local launch may claim live owner proof only
      from an exact process-birth identity. On Linux Oh-Goon records the owner PID together with the kernel boot ID and `/proc/<pid>/stat` starttime
      ticks; the latter two distinguish the same PID after reboot or reuse. Contributor mode must record the actual `scripts/dev.sh` shell as
      launch owner before any service process is observed, while each pre-exec child bridge separately records its own birth identity before transferring
      that unchanged process instance to uvicorn or npm with `exec`. Built local start records its current Python process as launch owner and
      its backend process observation. Older `service.spawned` v1 evidence containing only a PID remains readable but cannot establish birth proof.
      Status re-observes the recorded launch-owner birth identity: an exact match may produce `observation_freshness=current` and `owner_proof=available`;
      missing procfs, disappeared process, permission failure, reboot, or birth mismatch must preserve the last authoritative lifecycle and report
      `stale/unavailable`. None of those observations authorizes STOPPED/FAILED, binding replacement, attach, kill, retry or restart.'
    critical: false
  - id: ownership_boundary
    statement: The launch owner remains the authority that declares lifecycle transitions. The process-birth observer is read-only and may only
      compare Linux procfs identity facts. Launch Event/Manifest projection stores owner and service process observations separately. SafeLaunchStatus
      owns the live comparison and public freshness/proof result. Native uvicorn/npm/Vite keep process/runtime mechanics. Process absence, signalability,
      PID existence, or a service child staying alive cannot substitute for exact launch-owner birth identity.
    critical: false
  - id: consequence
    statement: Prevents PID reuse, a surviving child, or a best-effort liveness check from falsely proving that the same owner still controls
      a launch. It gives status a positive live-owner proof without weakening the separate rule that lifecycle becomes terminal only through authoritative
      owner events, which was required before the attach/reuse admission later covered by Q138 could safely land.
    critical: false
  contradictions:
  - id: fatal-01
    statement: Treats PID existence or `kill(pid, 0)` as process identity, uses a service child to prove the contributor shell owner, converts
      missing/mismatched birth proof into STOPPED/FAILED, automatically replaces a nonterminal binding, or lets process observation gain kill/restart/attach
      authority.
    severity: normal
    misconception_id: identity_scope_confusion
