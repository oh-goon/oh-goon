- id: Q74
  severity: critical
  expected_claims:
  - id: concept
    statement: Source admission still rejects real escaping symlinks. But a sandboxed dependency-materialization Step may legitimately create
      a generated virtualenv link naming immutable sandbox runtime authority such as /usr/bin/python3. Host-side output proof must not ignore
      that edge, because publishing the raw link would make downstream execution depend on a previous sandbox namespace. Before any host-side
      Git/evidence/publication, Fleet resolves the link in sandbox semantics, copies its target only from already-frozen declared runtime/tool
      authority into the explicit generated runtime root, replaces the link with owned bytes, and then runs the unchanged full owned-tree proof.
      Mutable attempt paths or undeclared sandbox authority are not materializable.
    critical: true
  - id: ownership_boundary
    statement: Source isolation rejects undeclared escapes; strict output sealing owns conversion of explicit generated runtime links into self-contained
      Fleet-owned bytes.
    critical: true
  - id: consequence
    statement: Prevents both false rejection of sandbox-generated virtualenv links and the more dangerous shortcut of whitelisting live escaping
      symlinks in published workspaces.
    critical: true
  contradictions:
  - id: fatal-01
    statement: Ignores generated-runtime escaping symlinks, publishes them unchanged, or weakens real source/owned-tree symlink rejection.
    severity: critical
    misconception_id: semantic_invariant_violation
