- id: Q65
  severity: normal
  expected_claims:
  - id: concept
    statement: backend/.venv and frontend/node_modules are generated developer materializations. They may exist locally, but canonical source
      policy excludes generated/operational state before source identity and certification snapshotting. Certification therefore proves source
      plus separately identified dependency supply, not the mutable contents of a developer environment.
    critical: false
  - id: ownership_boundary
    statement: Source identity, developer materialization and certification dependency identity are separate authorities.
    critical: false
  - id: consequence
    statement: Prevents stale/generated environment bytes and escaping virtualenv symlinks from becoming source evidence or changing certification
      identity.
    critical: false
  contradictions: []
  evidence_expectations:
