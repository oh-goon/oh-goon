  - id: fatal-01
    statement: Derives a certification helper executable from `sys.executable`; captures or persists secret credential values as cheap admission
      evidence; hashes/materializes retained content merely to decide whether queueing is possible; allows a wrong-owner/wrong-kind/missing retained
      reference or statically impossible executor inventory to enter placement; treats preflight as authoritative proof and removes preparation-time
      revalidation; or makes unknown Make spellings aliases that duplicate canonical command ownership.
