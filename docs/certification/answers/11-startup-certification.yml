  - docs/development/APP_CERTIFICATION.md:28
  - docs/development/APP_CERTIFICATION.md:1-35
- id: Q66
  severity: critical
  expected_claims:
  - id: concept
    statement: Managed-source admission proves Git-root topology and repository isolation before RUN_ADMITTED. The immutable execution snapshot
      then revalidates only the resolved requirements against sanitized execution bytes. Because Git metadata is intentionally excluded from the
      snapshot, execution must not re-run the live Git-root check or require .git to exist there.
    critical: true
  - id: ownership_boundary
    statement: Git topology belongs to managed-source admission; sanitized execution-byte validation belongs to snapshot execution scope.
    critical: true
  - id: consequence
    statement: Requiring both sanitized source and live Git metadata at the same stage creates an impossible certification contract.
    critical: true
  contradictions:
  - id: fatal-01
    statement: Re-runs live Git-root topology validation against the sanitized execution snapshot or requires .git to survive source sanitization.
    severity: critical
    misconception_id: semantic_invariant_violation
