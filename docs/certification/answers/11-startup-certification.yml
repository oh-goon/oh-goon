- id: Q133
  severity: critical
  expected_claims:
  - id: concept
    statement: 'Strict Step completion includes disposal of the Step''s attempt-private filesystem authority. A command return code of zero therefore
      cannot produce a clean Step PASS when `FailedPlanStepTeardownEvidence` says the attempt root could not be inspected, removed or proved absent.
      Game Tape must project that Step as failed, and certification handoff must use the durable teardown evidence to identify the exact Goon/Step,
      `step_teardown` boundary and teardown reason instead of emitting `Failure evidence: INCOMPLETE` or pretending the successful command itself
      failed. Because immutable/read-only dependency directories may legitimately exist inside the disposable attempt, Fleet may restore owner
      read/write/execute permission only on directories beneath that Fleet-owned attempt root before deletion; it must never chmod repository
      source, retained supply, caches or foreign paths. If owned cleanup still fails, certification remains non-successful.'
    critical: true
  - id: ownership_boundary
    statement: Fleet Plan execution owns the disposable attempt tree and its teardown proof; native commands own their exit status; Game Tape/handoff
      are read projections of durable execution/teardown evidence. Cleanup permission normalization is narrowly scoped to the already-owned private
      attempt and is not host-storage repair, repository mutation, authority broadening or permission recovery for external state.
    critical: true
  - id: consequence
    statement: 'Prevents a dependency-materialization command that completed successfully from ending certification with an unusable `ATTENTION_REQUIRED
      / Failure evidence: INCOMPLETE` handoff merely because read-only materialized directories blocked naive deletion, while retaining the security
      invariant that a genuinely unremoved private attempt cannot be certified clean.'
    critical: true
  contradictions:
  - id: fatal-01
    statement: Treats command exit 0 as Step PASS despite failed teardown, suppresses or ignores failed cleanup, reports a successful command
      as the failing command, relies on transient logs instead of durable teardown evidence, chmods repository/retained/foreign paths, or turns
      cleanup failure into automatic host-storage repair.
    severity: critical
    misconception_id: lifecycle_state_confusion
