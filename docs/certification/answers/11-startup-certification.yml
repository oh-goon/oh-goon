  severity: critical
  expected_claims:
  - id: concept
    statement: Certification must not mutate the checkout merely to carry generated execution identity. Backend certification bootstrap owns an
      isolated state root and a dedicated lock directory there. The workflow generates the exact `goon.lock` for the resolved APP/release Plan
      into that state-owned path with `oh-goon lock --output`, then passes the same path explicitly to `oh-goon plan run --lock-file`. Fleet still
      resolves the current source, loads the supplied lock, recomputes the expected execution fingerprint and fails closed on missing, malformed,
