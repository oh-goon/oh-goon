- id: Q75
  severity: normal
  expected_claims:
  - id: concept
    statement: Every changed source checkpoint handed off for another certification run increments the canonical product patch version in VERSION
      (for example 1267.0.0 -> 1267.0.1). The distributable source archive is named exactly oh-goon-<VERSION>.zip and package_slim gives it the
      extraction root oh-goon-<VERSION>/. PENDING, BLOCKED, diagnostic phase names, timestamps and proof commentary do not belong in the ZIP filename;
      they belong in CHECKPOINT_NOT_RELEASE.md, retained run evidence and the self-contained handoff. This keeps one short product identity usable
      by humans while exact source/dependency/Plan hashes remain the machine identities.
    critical: false
  - id: ownership_boundary
    statement: VERSION owns the checkpoint product version; the short archive name mirrors that owner only, while proof state is documentation/evidence
      rather than filename state.
    critical: false
  - id: consequence
    statement: Prevents multiple materially different patched ZIPs from all claiming 1267.0.0 and prevents operational filenames from becoming
      a second mutable status database.
    critical: false
  contradictions:
  - id: fatal-01
    statement: Reuses the same product version for changed handoff bytes or encodes PENDING/BLOCKED/debug phase state into the canonical ZIP filename.
    severity: normal
    misconception_id: semantic_invariant_violation
  evidence_expectations:
  - VERSION:1
  - docs/LOCAL_VERIFICATION.md:1-7
  - backend/src/oh_goon/repository_tooling/release/package_slim.py:193-210
