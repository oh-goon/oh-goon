- id: Q72
  severity: normal
  expected_claims:
  - id: concept
    statement: Do not broaden PATH first. Strict Fleet exposes the Step's explicit authority-bearing executables plus, only for an explicitly
      admitted shell, a fixed audited sandbox shell-support set whose exact membership is frozen and identity-bound. GNU Make may directly exec
      a simple recipe command such as printf or test instead of invoking a shell, while compound recipe fragments use /bin/sh. Diagnosis must
      therefore inspect the exact selected Make target and distinguish an authority-bearing child (whose derived need must fit the independent canonical permission ceiling), a shell
      builtin, and an ordinary shell-support helper (which must be covered by the fixed runtime-support contract). A missing core helper such
      as cat is therefore a support-contract regression, not a reason to hand-list it in every Goon. Adding /usr/bin/coreutils or an ambient baseline
      PATH would bypass bounded executable authority and can hide real missing grants in later Steps.
    critical: false
  - id: ownership_boundary
    statement: Missing-command diagnosis must preserve per-Step explicit authority and the fixed identity-bound shell-support contract; sandbox
      PATH/runtime is not a generic repair owner.
    critical: false
  - id: consequence
    statement: Prevents a misleading ENOENT symptom from turning into a broad ambient-tool escape that weakens strict execution and masks the
      actual Goon/Make child-command contract.
    critical: false
  contradictions:
  - id: fatal-01
    statement: Recommends adding a generic host PATH/coreutils baseline before proving whether Make directly executed an undeclared child or shell
      builtin.
    severity: normal
    misconception_id: hidden_fallback_assumption
  evidence_expectations:
