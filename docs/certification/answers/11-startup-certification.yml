    statement: '`assess_local_launch_reuse` is read-only admission and owns only the three-way decision `start_new` / `reuse` / `conflict`. `LocalLaunchBindingStore`
      remains the binding publication/replacement owner and still refuses nonterminal replacement. `SafeLaunchStatus` and the process-birth observer
      provide positive live-owner proof without lifecycle mutation. `LocalLaunchOwner` remains the only launch-event writer used when a new owner
      is actually created. `cli_start.py` and the contributor launch bridge consume the decision; native uvicorn/npm/Vite keep runtime mechanics.
