- id: Q69
  severity: critical
  expected_claims:
  - id: concept
    statement: Physical attempt creation owns the source-drift proof. It copies the frozen source into the disposable attempt workspace and compares
      the copied snapshot identity with the identity bound during strict run preparation before any command executes. Read-only source observation
      may inspect Git state for conditions/evidence, but must not perform a second full snapshot verification first; that would create a competing
      mutation gate over the same source and can reject harmless filesystem churn before the authoritative copy proof runs.
    critical: true
  - id: ownership_boundary
    statement: Attempt creation owns pre-execution source immutability proof; read-only observation owns no mutation decision.
    critical: true
  - id: consequence
    statement: Keeps one mutation authority and prevents redundant pre-hashing from producing false execution-identity failures.
    critical: true
  contradictions:
  - id: fatal-01
    statement: Makes read-only source observation a second execution source mutation gate or weakens the attempt copy-identity comparison.
    severity: critical
    misconception_id: identity_scope_confusion
  evidence_expectations:
  - backend/src/oh_goon/integrations/fleet_plan_run.py:195-224
  - backend/tests/unit/integrations/test_fleet_plan_attempt_authority.py:205-250
- id: Q70
  severity: critical
  expected_claims:
  - id: concept
    statement: 'A sanitized tree has one canonical execution-tree identity. After transient/generated paths are removed, source_snapshot_identity
      and the generic execution snapshot identity must describe the same bytes with the same digest semantics. Live/external capture may use before/copy/after
      stability proof, but once Fleet owns a frozen private snapshot, consumption is copy once, identify the exact destination once, and compare
      that identity with the already-bound identity before execution. The same rule applies to content-addressed retained objects: lease, copy,
      hash the materialized destination, and compare with the object SHA instead of repeatedly re-hashing the immutable source.'
    critical: true
  - id: ownership_boundary
    statement: Live source capture owns stability proof; Fleet-owned frozen inputs own content-addressed destination equality, with one canonical
      tree identity across both stages.
    critical: true
  - id: consequence
    statement: Prevents false source-drift failures from competing identity algorithms and removes repeated full-tree scans from attempt and certification
      startup without weakening the bytes that actually execute.
    critical: true
  contradictions:
  - id: fatal-01
    statement: Gives sanitized source and execution copies different identity algorithms or requires Fleet-owned frozen inputs to be source-hashed
      before and after every copy.
    severity: critical
    misconception_id: identity_scope_confusion
  evidence_expectations:
  - backend/src/oh_goon/integrations/source_snapshot.py:18-105
  - backend/src/oh_goon/integrations/content_snapshot.py:116-178
  - backend/src/oh_goon/integrations/fleet_plan_run.py:198-232
  - backend/src/oh_goon/integrations/fleet_content_store.py:72-177
- id: Q71
  severity: critical
  expected_claims:
  - id: concept
    statement: Strict preparation may resolve and freeze the union of host tools and imported host-environment values once for reproducibility
      and efficient evidence capture, but each physical Step attempt receives only the executable names derived from that Step plus its explicit
      capabilities.tools child executables, and only the host-environment names imported by that Step. Another Step declaring sh, uv, npm, a registry
      credential or any other value must never make that authority ambient to its siblings. Run-wide inventory is evidence/storage ownership,
      not cross-Step execution permission.
    critical: true
  - id: ownership_boundary
    statement: Run preparation owns union capture; the Step declaration owns the subset exposed to that Step attempt.
    critical: true
  - id: consequence
    statement: Prevents ghost capability/credential ownership and Plan-order-dependent execution where one Step succeeds only because another
      Step declared a tool or secret.
    critical: true
  contradictions:
  - id: fatal-01
    statement: Treats the run-wide frozen tool/environment union as ambient execution authority for every Step.
    severity: critical
    misconception_id: identity_scope_confusion
