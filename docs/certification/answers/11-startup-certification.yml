- id: Q199
  severity: critical
  expected_claims:
  - id: concept
    statement: "Strict Fleet admission must derive the tools required by the resolved Plan after projecting imported Goons for every selected\
      \ repository, then prove the configured execution-environment path authority can supply the union before executor queueing, capacity reservation,\
      \ final Fleet admission, or `RUN_ADMITTED`. An imported Goon that is not applicable to any selected repository contributes no tool requirement;\
      \ if it is applicable to at least one selected repository, its tools are mandatory. Candidate placement must then independently prove isolation/backend\
      \ availability and aggregate capacity before the final atomic admission cut. Native workload boundaries that are shared by several canonical\
      \ Goons must own their tool requirement once at the workload itself\u2014for canonical Make workloads, an immediately adjacent machine-readable\
      \ Make target annotation is that owner\u2014and the Goon requirements registry may reference that owner rather than copy the list. Static\
      \ admission must reject a missing owner, owner/command drift, missing authority-bearing grants, shell helpers outside the fixed support\
      \ contract, or excess explicit authority. The early tool-feasibility result is deliberately not persisted as execution evidence: strict\
      \ preparation must resolve the same repository-applicable Plan again and revalidate/freeze actual host tools before any effect starts."
    critical: true
  - id: ownership_boundary
    statement: The Make target owns what tools its native workload intrinsically needs; `integrations/workload_execution_requirements.py` parses
      and identities that owner contract; `goon_static_admission.py` binds canonical Goon Steps to those owners and enforces declared least privilege.
      Repository import applicability owns which imported Steps exist for one repository. `ExecutorPlacementAdmission` owns the pre-`RUN_ADMITTED`
      feasibility cut and candidate backend/capacity selection, while deployment `StrictHostPathAuthority` owns which host tools can actually
      be supplied. `FleetPlanRunExecutor.prepare_strict_run` remains the authoritative post-admission preparation boundary that rechecks and freezes
      tool bytes, so cheap preflight cannot become stale execution truth.
    critical: true
  - id: consequence
    statement: This converts a deterministic "the selected execution environment cannot run this workload" failure from a post-admission preparation
      failure into a cheap pre-admission rejection, while preserving correctness for optional imports. Moving shared native workload requirements
      to the actual workload owner also means one change invalidates every canonical consumer instead of letting two Goons silently disagree.
      Revalidation during preparation preserves safety under host drift and keeps observed executable identity separate from cheap feasibility.
    critical: true
  - id: reasoning_extension
    statement: The answer must use repository evidence to distinguish the canonical owner/authority from a plausible nearby observer or shortcut,
      and must reason about the requested boundary, change, failure, or adjacent owner without inventing a second source of truth.
    critical: false
  contradictions:
  - id: fatal-01
    statement: Admits a strict run before proving repository-applicable required tools exist; requires tools from imports that are not applicable
      to any selected repository; lets duplicate canonical Goons maintain independent tool lists for the same owned Make workload; treats early
      feasibility as durable execution evidence; or removes preparation-time revalidation/freezing of actual tool identity.
    severity: critical
    misconception_id: identity_scope_confusion
