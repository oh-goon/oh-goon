- id: Q129
  severity: normal
  expected_claims:
  - id: concept
    statement: Strict Fleet runtime capture must treat the selected Python runtime as more than the interpreter executable plus copied stdlib
      directories. Native stdlib extension modules are loaded later with `dlopen`; an extension such as `_ssl*.so` can depend on `libssl.so.3`
      and `libcrypto.so.3` even when the Python executable itself does not link them. For every exact Python stdlib/platstdlib directory already
      selected for the frozen runtime, Fleet therefore inspects the native `*.so` modules with the same trusted `ldd` runtime inspector used for
      executables, preserves exact ABI/symlink aliases, and adds only those discovered shared-library bytes to the immutable runtime root. The
      stdlib directory selection and interpreter identity remain unchanged, and Fleet must not solve the failure by mounting live `/lib` or `/usr/lib`,
      widening `LD_LIBRARY_PATH`, installing OpenSSL into the workspace, or treating host libraries as ambient authority.
    critical: false
  - id: ownership_boundary
    statement: Python/system-runtime discovery owns which interpreter and stdlib directories are admitted; Fleet runtime capture owns the exact
      transitive native-library closure of every executable/native module that those frozen runtime bytes can load; the strict sandbox consumes
      only that frozen closure. Workspace dependency materialization does not become a system-library installer.
    critical: false
  - id: consequence
    statement: 'Prevents a correctly frozen Python interpreter and stdlib from failing only when a native extension is first imported, such as
      `ImportError: libssl.so.3: cannot open shared object file`, while preserving exact runtime provenance and avoiding broad live host-library
      authority.'
    critical: false
  contradictions:
  - id: fatal-01
    statement: Freezes only the interpreter executable dependencies, mounts broad live host library directories, repairs the failure with ambient
      `LD_LIBRARY_PATH`, installs system libraries into the workspace, or skips exact alias/runtime identity preservation for extension-module
      dependencies.
    severity: normal
    misconception_id: identity_scope_confusion
