- id: Q145
  severity: normal
  expected_claims:
  - id: concept
    statement: 'Certification static admission must invoke the canonical Goon compiler authority in-process from the installed Oh-Goon package;
      it must never infer a sibling `oh-goon-goon-compile` executable from `sys.executable`, because native uv may execute an environment console
      script with a base interpreter whose physical `bin` directory is different. Strict Fleet admission must then reject deterministic repository-applicable
      host-environment and credential defects, retained-cache reference owner/kind/presence defects, and executor inventory whose immutable backend/isolation/configured
      CPU-memory-process capacity cannot satisfy one attempt before placement queueing or `RUN_ADMITTED`. Credential preflight validates presence/non-empty/format
      without retaining secret bytes as evidence. Retained-input preflight validates reference ownership, declared kind, and object presence without
      hashing potentially multi-gigabyte content. Static executor feasibility distinguishes impossible configured inventory from mutable capacity/operator/physical
      availability that may legitimately wait. None of these cheap checks is execution truth: preparation must resolve applicability again, capture
      and validate private host values, lease and verify immutable retained bytes, and revalidate/freeze the selected executor/tool authority
      before effects. Unknown contributor Make targets should expose the canonical `make help` surface and fail non-zero rather than creating
      typo aliases or a second command authority.'
    critical: false
  - id: ownership_boundary
    statement: '`certification_frontdoor.py` owns the pre-mutation certification source gate and calls the product-safe `compile_canonical_goons`
      authority directly; the repository-tooling console command is only an adapter over that same compiler. Repository applicability plus `_fleet_plan_host_resources.py`
      own cheap host-import/credential feasibility while `capture_host_environment` remains the later private-value capture boundary. `FleetContentStore`
      owns retained reference metadata and immutable object identity; lifecycle admission may ask it only for cheap owner/kind/presence proof,
      while strict preparation retains lease/hash/materialization authority. `ExecutorPlacementAdmission` owns immutable configured executor feasibility
      before queueing and keeps mutable backend/capacity/operator checks in placement. Production composition must inject the same content-store
      authority into lifecycle and execution consumers. The Makefile owns contributor command discovery; `.DEFAULT` may display `make help` but
      must still reject the unknown target.'
    critical: false
  - id: consequence
    statement: This removes the exact certification crash where a valid `backend/.venv/bin/oh-goon-workflow` process looked for `oh-goon-goon-compile`
      beside uv's base CPython instead of inside the project environment. It also moves deterministic secret/input/resource failures ahead of
      queueing, source/runtime preparation, and expensive retained-content verification while preserving the authoritative owner checks required
      under drift. The result is faster failure without converting speculative preflight into trusted execution evidence, and a mistyped Make
      command becomes self-correcting UX instead of another supported alias.
    critical: false
