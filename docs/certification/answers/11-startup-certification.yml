- id: Q136
  severity: normal
  expected_claims:
  - id: concept
    statement: 'Current-launch selection must be deterministic and identity-bound: canonicalize the exact current workspace, derive its collision-resistant
      workspace identity, read exactly that workspace binding, then read exactly the bound launch ID and owner generation and revalidate the resolved
      launch-intent identity against the launch record. Status must never scan launch files, pick the newest mtime, or use PID existence as current-owner
      proof. A binding may be replaced only after the exact previously bound launch proves a terminal lifecycle through its durable event record.
      If that record is missing, malformed, generation-mismatched, intent-mismatched, or still nonterminal, replacement is refused rather than
      repaired or guessed. `oh-goon status --json` emits one versioned safe `oh-goon.launch-status/v1` document from a centralized whitelist and
      must not serialize commands, credentials, raw event payloads, or the raw Launch Manifest. At the 1267.0.38 boundary, before process-birth
      identity landed, a nonterminal launch preserved its last authoritative lifecycle while reporting `observation_freshness=stale` and `owner_proof=unavailable`;
