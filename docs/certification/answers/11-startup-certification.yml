- id: Q146
  severity: normal
  expected_claims:
  - id: concept
    statement: 'First-checkout bootstrap must delegate native-tool compatibility to the tools that own it: native uv enforces backend/pyproject.toml
      requires-python and [tool.uv].required-version, while native npm with frontend/.npmrc engine-strict=true enforces frontend/package.json
      engines. Oh-Goon may report observed versions and owning declarations but must not parse or re-enforce their semantics; missing or incompatible
      tools fail through the native materialization command before bootstrap can pass. APP certification must reuse the same native `make init` materialization owner as development and must not introduce a certification-only resolver, dependency cache, or offline replay authority. Long preparation before
      a Step subprocess exists must publish bounded path-free transient activity through the existing progress/live-output owners, including native materialization and run-preparation activity; those hints are never durable Run truth and machine protocol records remain captured rather than
      printed as activity. An admitted SQLite journal must use filesystem device/inode identity to prove that the configured path still names
      the admitted file, while SQLite itself proves database readability and the expected user_version/schema through a real connection. A second
      raw file reader must not guess SQLite validity from header bytes. One transient SQLite NOTADB/CORRUPT observation on an unchanged admitted
      inode may trigger only a bounded observation-only re-proof: reconnect without create, re-prove the expected user_version and require SQLite
      quick_check=ok before continuing. This is not execution retry and must never recreate/repair the database. Stable path replacement, same-inode
      truncation/corruption, persistent format failure, and wrong schema must all still fail closed.'
    critical: false
  - id: ownership_boundary
    statement: 'backend/pyproject.toml and frontend/package.json own native tool requirements; native uv/npm own compatibility admission, and
      dependency_resolution_bootstrap.py does not duplicate version semantics. canonical `make init` is the single normal materialization boundary; verification Plans consume that initialized repository, while native uv/npm own dependency materialization and _fleet_plan_run_lineage.py only binds generic retained content when a Plan explicitly requests it. workflow.py captures backend machine protocol but forwards only explicit OH-GOON ACTIVITY
      records through its transient progress descriptor; GameTapeLiveOutputStore and FleetRunExecution own bounded process-local post-admission
      preparation activity before Step output. LocalDatabase owns runtime SQLite path identity: filesystem dev/inode proves path continuity and
      SQLite PRAGMAs/database errors prove the admitted schema/format. LocalDatabase alone owns the bounded same-inode SQLite re-proof, uses non-creating
      mode=rw for admitted reconnects, and requires quick_check after a transient format observation before continuing. None of these transient/readiness
      observations may replace durable execution evidence or authoritative revalidation.'
    critical: false
  - id: consequence
    statement: This prevents predictable first-checkout and certification failures from burning minutes before explaining a missing/incompatible
      native tool or native dependency failure, while preserving committed-lock reproducibility. It also fixes the observed multi-minute apparent certification
      freeze by exposing real preparation progress before the first Step emits stdout, without inventing a second event history. Finally, it removes
      a fragile duplicate SQLite parser and avoids converting one transient SQLite format observation into false durable identity loss, while
      retaining fail-closed detection for actual file replacement, truncation, persistent corruption, or schema drift. No certification Step or
      external effect is replayed.
    critical: false
  contradictions:
  - id: fatal-01
    statement: Parses or copies uv/Node/npm compatibility into another authoritative checker; converts observed versions into synthetic compatibility
      admission decisions; treats native materialization progress or transient activity as durable execution evidence; buffers all preparation activity until completion; prints backend machine protocol as human progress; validates a live SQLite database by a second raw header reader instead
      of SQLite; ignores dev/inode replacement; recreates/repairs the admitted database; retries certification execution/effects because SQLite
      identity observation failed; accepts a transient format error without re-proving schema plus quick_check; or continues after persistent
