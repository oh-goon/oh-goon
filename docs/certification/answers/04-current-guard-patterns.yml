- id: Q215
  severity: normal
  expected_claims:
  - id: concept
    statement: SystemInvariantAuditor.audit classifies one transactionally consistent durable runtime safety cut; the findings returned from one call are only the violations observed in that cut, not the universe of possible finding codes.
    critical: true
  - id: ownership_boundary
    statement: recovery.py defines the typed InvariantFinding union and a generic code field, while concrete finding codes are emitted by invariant-auditor branches and must be established from source/test evidence rather than inferred from one runtime audit result.
    critical: true
  - id: consequence
    statement: Confusing an observed runtime result with a static catalog can silently omit dormant invariant paths and produce a false completeness claim.
    critical: false
  contradictions:
  - id: observation-01
    statement: Claims that one SystemInvariantAuditor.audit invocation enumerates all possible invariant codes or that recovery.py itself is the complete concrete-code registry.
    severity: critical
    misconception_id: desired_observed_conflation
  evidence_expectations:
  - backend/src/oh_goon/services/invariant_auditor.py:44-105
  - backend/src/oh_goon/core/models/recovery.py:31-75

- id: Q219
  severity: normal
  expected_claims:
  - id: concept
    statement: Oh-Goon already owns critical behavioral coverage through docs/development/REAL_LIFECYCLE_QA.yml, which defines lifecycle, boundary, adversarial, and mutation proof levels and requires production-shaped evidence rather than raw test counts.
    critical: true
  - id: ownership_boundary
    statement: A genuinely missing failure mode should extend the existing lifecycle ledger and its executable contract/tests, not create an independent failure-mode matrix that can drift from the selected Make/test evidence.
    critical: true
  - id: consequence
    statement: One executable coverage ledger keeps claimed lifecycle proof connected to real pytest nodes and prevents a second manual coverage authority from diverging.
    critical: false
  contradictions:
  - id: duplicate-coverage-01
    statement: Introduces a standalone manually maintained failure-mode matrix as the new primary behavioral-coverage authority without integrating the existing real-lifecycle ledger.
    severity: critical
    misconception_id: duplicate_owner_assumption
  evidence_expectations:
  - docs/development/REAL_LIFECYCLE_QA.yml:1-16
  - scripts/tests/test_real_lifecycle_qa_contract.py:17-56
