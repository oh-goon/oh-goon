section: current-guard-patterns
questions:
- id: Q16
  severity: normal
  expected_claims:
  - id: concept
    statement: start and stop both hold _lifecycle_lock; stop holds it across setting the stop event, joining the captured thread, and clearing the same thread reference, so concurrent start cannot clear/publish a replacement before stop returns.
    critical: false
  - id: ownership_boundary
    statement: Thread identity publication and join are one serialized lifecycle operation.
    critical: false
  - id: consequence
    statement: This is the current closure of the historical thread-handle race; reporting the old race as present is wrong.
    critical: false
  contradictions: []
  evidence_expectations:
  - backend/src/oh_goon/runtime/schedule_scheduler.py:30-60
- id: Q17
  severity: normal
  expected_claims:
  - id: concept
    statement: backend/src/oh_goon/engine/command.py::_terminate_process_group sends SIGTERM, polls process-group existence with time.sleep(POLL_INTERVAL_SECONDS) until a monotonic grace deadline, then sends SIGKILL if still present.
    critical: false
  - id: ownership_boundary
    statement: Termination is bounded and escalates explicitly.
    critical: false
  - id: consequence
    statement: Agents should recognize real polling/timeout code rather than inventing async behavior.
    critical: false
  contradictions: []
  evidence_expectations:
  - backend/src/oh_goon/engine/command.py:180-209
- id: Q18
  severity: normal
  expected_claims:
  - id: concept
    statement: Kubernetes rollout verification loops in integrations/fleet_plan_kubernetes_rollout_execution.py, bounded by step.timeout_seconds/deadline, with request bounds and sleeper(min(policy.poll_interval_seconds, remaining)).
    critical: false
  - id: ownership_boundary
    statement: Polling is dependency-injected and bounded by policy/time remaining.
    critical: false
  - id: consequence
    statement: Tests can replace the sleeper/clock and reason about bounded rollout behavior deterministically.
    critical: false
  contradictions: []
  evidence_expectations:
  - backend/src/oh_goon/integrations/fleet_plan_kubernetes_rollout_execution.py:115-185
- id: Q19
  severity: critical
  expected_claims:
  - id: concept
    statement: Writes carry expected_revision through SharedPlanFileStore/LeagueLineupFileStore exact-file commits and Fleet Plan source commit; stale/removed revisions fail instead of overwriting newer bytes. SharedPlanService propagates expected_revision through read/save/preview boundaries.
    critical: true
  - id: ownership_boundary
    statement: A safety/write proof is valid only for the exact revision observed.
    critical: true
  - id: consequence
    statement: Prevents stale agent/UI writes from silently replacing concurrent durable state.
    critical: true
  contradictions:
  - id: fatal-01
    statement: Allows a write/safety proof to commit without the exact observed revision or against a different revision.
    severity: critical
    misconception_id: semantic_invariant_violation
  evidence_expectations:
  - backend/src/oh_goon/runtime/shared_plans.py:33-95
  - backend/src/oh_goon/runtime/league_lineups.py:36-134
  - backend/src/oh_goon/integrations/fleet_plan_source.py:35-89
  - backend/src/oh_goon/services/shared_plans.py:166-214
  - backend/AGENTS.md:73-75
- id: Q20
  severity: normal
  expected_claims:
  - id: concept
    statement: ApiClientProvider captures supplied client/controllers as mount authority and throws if their identities change without remount; its transport is created once in useState. If both controllers are supplied they must share the same causality clock.
    critical: false
  - id: ownership_boundary
    statement: Transport/read/write authority is mount-bound and causally singular.
    critical: false
  - id: consequence
    statement: Prevents provider rerenders from silently replacing transport or splitting read/write causality.
    critical: false
  contradictions: []
  evidence_expectations:
  - frontend/src/app/ApiClientProvider.tsx:33-50
