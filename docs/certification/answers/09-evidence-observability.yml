section: evidence-observability
questions:
- id: Q51
  severity: normal
  expected_claims:
  - id: concept
    statement: Historical Game Tape may expose the failed Step exit/reason plus durable stdout/stderr anchor facts such as stream, SHA-256, line count, byte count, and attempt number when available. Historical raw bytes and source-line extraction are not durable and must be reported unavailable rather than reconstructed.
    critical: false
  - id: ownership_boundary
    statement: Durable evidence fingerprints are not raw-log storage.
    critical: false
  - id: consequence
    statement: Prevents fabricated debugging evidence and accidental persistent raw-log authority.
    critical: false
  contradictions: []
  evidence_expectations:
  - docs/development/GAME_TAPE.md:120-131
  - backend/src/oh_goon/core/models/game_tape.py:44-64
  - backend/src/oh_goon/core/game_tape_step_projection.py:163-205
- id: Q52
  severity: critical
  expected_claims:
  - id: concept
    statement: Scout owns cross-execution analytical observations/aggregates and read navigation only. It never executes, schedules, admits, retries, cancels, places, throttles, or modifies work; execution has no runtime dependency on Scout and must behave identically if Scout is unavailable. Scout API is GET-only.
    critical: true
  - id: ownership_boundary
    statement: Analytics is an optional observer, never an execution dependency.
    critical: true
  - id: consequence
    statement: Prevents optional analytics from becoming a control-plane or availability dependency.
    critical: true
  contradictions:
  - id: fatal-01
    statement: Allows Scout to execute, mutate, authorize, or become a dependency of execution.
    severity: critical
    misconception_id: observer_authority_confusion
  - id: fatal-02
    statement: Treats Scout observations, aggregates, or navigation projections as canonical Run/execution truth merely because they observe the system.
    severity: critical
    misconception_id: observer_authority_confusion
  evidence_expectations:
  - docs/development/THE_SCOUT.md:10-18
  - docs/development/THE_SCOUT.md:58-69
  - backend/src/oh_goon/scout/service.py:41-70
- id: Q53
  severity: normal
  expected_claims:
  - id: concept
    statement: enforcer.yml is a deterministic non-secret debugging projection for one admitted strict run. Journal and canonical operation evidence remain authoritative and the receipt can be regenerated; it is not pipeline configuration, durable truth, mutable state, or another validation engine.
    critical: false
  - id: ownership_boundary
    statement: Enforcer proves admission; the receipt only projects that proof and later facts.
    critical: false
  - id: consequence
    statement: Prevents a convenient receipt from becoming ghost policy/state ownership.
    critical: false
  contradictions: []
  evidence_expectations:
  - docs/development/ENFORCER_RECEIPTS.md:1-9
  - docs/development/ENFORCER_RECEIPTS.md:180-189
  - backend/src/oh_goon/services/enforcer_run_receipt.py:43-102
- id: Q54
  severity: normal
  expected_claims:
  - id: concept
    statement: If a fact already exists in Run/Game Tape, add only a read projection/aggregation. Typed execution evidence needing fleet query belongs in its narrow domain observation owner. High-volume analytical/resource telemetry belongs to optional Scout. Do not create GenericMetric/GenericObservation, a central metrics DB, frontend status derivation, or an observability write path into execution.
    critical: false
  - id: ownership_boundary
    statement: New observability follows the existing fact owner and missing-data semantics.
    critical: false
  - id: consequence
    statement: Prevents observability from becoming a generic second product state model.
    critical: false
  contradictions: []
  evidence_expectations:
  - docs/OBSERVABILITY.md:14-39
  - backend/src/oh_goon/core/models/execution_observability.py:50-61
  - backend/src/oh_goon/scout/service.py:41-70
