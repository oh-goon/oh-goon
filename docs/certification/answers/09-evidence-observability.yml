- id: Q205
  severity: normal
  expected_claims:
  - id: concept
    statement: Hashmarks may retain fresh, generation-bound repository-negative evidence that a hypothesis/edit target was disproven; Oh-Goon owns execution failure classification plus retry, resume, timeout refinement, and environment recovery policy.
    critical: true
  - id: ownership_boundary
    statement: Repository-negative evidence is input evidence to a later decision, not an autonomous recovery strategy or execution command.
    critical: true
  - id: consequence
    statement: Prevents repository evidence from silently acquiring execution-loop authority.
    critical: false
  contradictions:
  - id: boundary-01
    statement: Lets Hashmarks negative evidence choose or launch a retry/recovery action, or stores Oh-Goon execution recovery as Hashmarks repository-negative state.
    severity: critical
    misconception_id: duplicate_owner_assumption
  evidence_expectations:
  - AGENTS.md:93-120
  - docs/development/HASHMARKS_EXECUTION_LAYER.md:3-17
- id: Q208
  severity: normal
  expected_claims:
  - id: concept
    statement: Game Tape is Oh-Goon's read-only projection over already-owned durable execution and referenced repository evidence. It never schedules, retries, mutates, admits, or becomes a second result/lifecycle authority.
    critical: true
  - id: ownership_boundary
    statement: Execution owners and backend canonical result semantics remain authoritative; Game Tape only projects their facts.
    critical: true
  - id: consequence
    statement: Prevents observability from becoming an execution or lifecycle control plane.
    critical: false
  contradictions:
  - id: boundary-01
    statement: Makes Game Tape decide, schedule, retry, or reinterpret execution because it can display repository and execution provenance.
    severity: critical
    misconception_id: observer_authority_confusion
  evidence_expectations:
  - backend/src/oh_goon/core/game_tape_projection.py:29-69
  - backend/src/oh_goon/repository_tooling/repository_understanding_game_tape.py:1-53


- id: Q214
  severity: normal
  expected_claims:
  - id: concept
    statement: Historical plan status markers are not current defect truth by themselves; their version context must be compared with the current checkout and corroborated by present source, tests, contracts, checkpoint evidence, or native observations.
    critical: true
  - id: ownership_boundary
    statement: A planning document may describe intended architecture or a blocker that was real for an older candidate, but it does not own current implementation or qualification state after later checkpoints have superseded that packet.
    critical: true
  - id: consequence
    statement: Treating stale GATED/BLOCKED text as live findings creates false positives and can reopen already-closed work.
    critical: false
  contradictions:
  - id: stale-status-01
    statement: Converts every CANDIDATE, GATED, BLOCKED, or externally blocked marker in the historical plan directly into a current actionable finding without version/current-evidence corroboration.
    severity: critical
    misconception_id: lifecycle_state_confusion
  evidence_expectations:
  - docs/architecture/ADR_CANONICAL_OWNER_REPLACEABLE_IMPLEMENTATIONS.md:1-5
  - docs/certification/README.md:11-23
  - VERSION:1

- id: Q218
  severity: normal
  expected_claims:
  - id: concept
    statement: A numeric severity-times-impact formula may be a triage aid, but it is not sufficient evidence that a finding exists or that its rank is authoritative.
    critical: true
  - id: ownership_boundary
    statement: Prioritization must preserve evidence quality, currentness, reproducibility, affected authority/invariant, and explicit uncertainty; stale hypotheses, metric-only signals, and insufficient-evidence candidates must not be promoted into confirmed top findings by arithmetic alone.
    critical: true
  - id: consequence
    statement: A forced top-ten list can create false precision, hide a non-compensatory critical invariant behind aggregate scores, and turn unsupported hypotheses into apparent facts.
    critical: false
  contradictions:
  - id: score-01
    statement: Treats severity weight multiplied by impact factor as a sufficient proxy for criticality and forces exactly ten winners even when evidence is stale, ambiguous, or insufficient.
    severity: critical
    misconception_id: absence_as_positive_evidence
  evidence_expectations:
  - docs/certification/README.md:11-23
  - docs/certification/README.md:129-135
  - docs/certification/README.md:211-215
