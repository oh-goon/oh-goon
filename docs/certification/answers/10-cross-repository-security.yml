schema_version: 1
source_version: 1267.0.1052
section: cross-repository-security
questions:
- id: Q56
  severity: critical
  expected_claims:
  - id: concept
    statement: 'For a Shared Run, selected repositories'' root goon.yml files are omitted completely: they are not read, resolved, validated, merged, inherited, executed, or used as fallback. The selected Shared Plan plan.yml owns executable intent for that run.'
    critical: true
  - id: ownership_boundary
    statement: Team-owned CI/CD and Shared-Plan CI/CD are separate source modes that converge only after resolution.
    critical: true
  - id: consequence
    statement: Prevents accidental mixing of repository pipelines into a shared execution definition.
    critical: true
  contradictions:
  - id: fatal-01
    statement: Reads or resolves selected repositories root goon.yml during Shared-Plan execution.
    severity: critical
    misconception_id: semantic_invariant_violation
  evidence_expectations:
  - docs/LOCAL_FIRST.md:95-101
  - backend/src/oh_goon/services/shared_plans.py:291-315
- id: Q57
  severity: critical
  expected_claims:
  - id: concept
    statement: run.yml target.repository_id explicitly selects one registered repository. Empty or omitted target scope refuses and must never expand to all repositories; Shared Run service/API operations retain their own explicit reviewed target set.
    critical: true
  - id: ownership_boundary
    statement: Destructive/effectful target scope must be explicit.
    critical: true
  - id: consequence
    statement: Prevents an empty selector from silently expanding blast radius.
    critical: true
  contradictions:
  - id: fatal-01
    statement: Treats omitted/empty repository scope as all repositories instead of requiring explicit operator scope.
    severity: critical
    misconception_id: semantic_invariant_violation
  evidence_expectations:
  - docs/CI_CD_CONTRACT.md:76-87
  - backend/src/oh_goon/core/models/run_admission.py:54-71
- id: Q58
  severity: normal
  expected_claims:
  - id: concept
    statement: No. team validate and enforcer run resolve the Team's current root goon.yml and call the same canonical read-only Fleet-plan preview/admission owner used before execution. They do not infer a project-type quality baseline.
    critical: false
  - id: ownership_boundary
    statement: Repository requirements live in goon.yml and inspection reuses execution semantics.
    critical: false
  - id: consequence
    statement: Prevents local inspection from becoming a parallel policy engine.
    critical: false
  contradictions: []
  evidence_expectations:
  - docs/development/LOCAL_TEAM_RUNS.md:22-30
  - backend/src/oh_goon/cli_runtime_league.py:51-72
  - backend/src/oh_goon/cli_enforcer.py:24-52
  - backend/src/oh_goon/services/goon.py:26-51
- id: Q59
  severity: normal
  expected_claims:
  - id: concept
    statement: 'No. League scanning is cheap structural discovery: it proves the exact root goon.yml is present/safe to read and fingerprints bytes. Semantic readiness is established only by explicit inspection or run admission, so scanning never executes or silently validates every pipeline.'
    critical: false
  - id: ownership_boundary
    statement: Discovery and semantic admission are distinct owners/cost boundaries.
    critical: false
  - id: consequence
    statement: Prevents fleet discovery from acquiring hidden execution/validation behavior.
    critical: false
  contradictions: []
  evidence_expectations:
  - docs/development/LOCAL_TEAM_RUNS.md:22-30
  - backend/src/oh_goon/services/league.py:27-42
  - backend/src/oh_goon/services/league.py:106-195
- id: Q60
  severity: critical
  expected_claims:
  - id: concept
    statement: No. Physical retained objects may deduplicate by content hash, but a hash is provenance only. Consumption uses an opaque repository-owned ref and materialization must prove the destination belongs to the same repository owner; another repository's hash/ref never grants byte access.
    critical: true
  - id: ownership_boundary
    statement: Physical content identity is not authorization; repository-owned reference/lease identity is.
    critical: true
  - id: consequence
    statement: Prevents cross-repository content disclosure through deduplication identifiers.
    critical: true
  contradictions:
  - id: fatal-01
    statement: Treats physical content hash equality by itself as authorization to consume a retained object across repository ownership boundaries.
    severity: critical
    misconception_id: identity_scope_confusion
  evidence_expectations:
  - docs/development/DATAFLOW.md:14-16
  - backend/src/oh_goon/integrations/fleet_content_store.py:236-280
  - backend/src/oh_goon/integrations/fleet_content_store_lifecycle.py:245-261
