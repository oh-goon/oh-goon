- id: Q204
  severity: normal
  expected_claims:
  - id: concept
    statement: Hashmarks owns static cross-repository/project dependency and shared-input evidence; Oh-Goon owns admitted Fleet membership, Plan/Schedule coordination, CI scheduling, and process execution. Static topology is evidence, not a schedule.
    critical: true
  - id: ownership_boundary
    statement: A dependency edge may inform admission/impact but cannot itself enqueue, place, or execute either repository.
    critical: true
  - id: consequence
    statement: Prevents repository topology from becoming a hidden operational control plane.
    critical: false
  contradictions:
  - id: boundary-01
    statement: Treats a Hashmarks project dependency/shared-input edge as Fleet membership or scheduling authority.
    severity: critical
    misconception_id: dependency_direction_reversal
  evidence_expectations:
  - AGENTS.md:93-115
  - docs/development/HASHMARKS_EXECUTION_LAYER.md:11-17


- id: Q217
  severity: normal
  expected_claims:
  - id: concept
    statement: Raw vocabulary occurrence is not equivalent to owning a Hashmarks repository-intelligence capability; the boundary guard reasons over capability-like definitions/module identifiers, imports, forbidden execution helpers, and explicit allowed consumer/integration roles.
    critical: true
  - id: ownership_boundary
    statement: Oh-Goon documentation, tests, execution consumers, and boundary contracts may legitimately mention CodeMap or verification-selection terminology while still being forbidden from implementing repository-intelligence semantics outside the admitted adapter boundary.
    critical: true
  - id: consequence
    statement: A token-only scanner would both flag legitimate references and miss semantically equivalent duplicate ownership that avoids the chosen words.
    critical: false
  contradictions:
  - id: lexical-01
    statement: Declares any CodeMap or verification-selection token outside integrations/hashmarks* to be a boundary leak without checking semantic ownership or allowed consumer roles.
    severity: critical
    misconception_id: observer_authority_confusion
  evidence_expectations:
  - backend/src/oh_goon/repository_tooling/architecture/hashmarks_harness_boundary_contract.py:34-55
  - backend/src/oh_goon/repository_tooling/architecture/hashmarks_harness_boundary_contract.py:118-163
  - AGENTS.md:183-190
