- id: Q206
  severity: normal
  expected_claims:
  - id: concept
    statement: Hashmarks downstream-contract identity, repository/source identity, selection-envelope provenance, and selected-membership identity are producer-side repository facts; Oh-Goon execution-plan/work identities, a Fleet Run, and each physical attempt have distinct execution identities. None is an alias for another.
    critical: true
  - id: ownership_boundary
    statement: Admission, resume, evidence, and Game Tape must preserve the lineage between these identities instead of collapsing producer identity into run/attempt identity.
    critical: true
  - id: consequence
    statement: Prevents stale producer evidence from being mistaken for current execution and prevents execution facts from rewriting repository evidence identity.
    critical: false
  contradictions:
  - id: boundary-01
    statement: Treats Hashmarks contract/envelope/membership identity as the Oh-Goon execution plan, Run, or physical attempt identity, or permits resume solely because one of those unrelated identity domains matches.
    severity: critical
    misconception_id: identity_scope_confusion
